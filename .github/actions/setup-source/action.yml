name: Activate the fixed source runtime
description: Verify fixed libraries and trained data, then install only this checked-out source
inputs:
  integrity_scope:
    description: Explicit production source or publication scope; empty in CI
    default: ''
runs:
  using: composite
  steps:
    - name: Trust only the mounted code checkout
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: Verify the immutable runtime contract without OCR
      shell: bash
      run: python runtime/smoke.py backend/requirements.lock --metadata-only
    - name: Install the checked-out backend without dependency resolution
      shell: bash
      run: python -m pip install --no-deps --no-build-isolation -e backend
    - name: Enable bounded content failure receipts
      shell: bash
      env:
        SCOPE: ${{ inputs.integrity_scope }}
      run: |
        if [ -n "$SCOPE" ]; then
          echo "UNISON_INTEGRITY_SCOPE=$SCOPE" >> "$GITHUB_ENV"
          echo "UNISON_INTEGRITY_DIRECTORY=$RUNNER_TEMP/unison-integrity" >> "$GITHUB_ENV"
        fi
