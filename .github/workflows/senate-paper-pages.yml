name: Senate paper PTR pages
on:
  workflow_dispatch:
    inputs:
      replay_saved_paper:
        description: Replay explicitly selected existing source-bound paper inputs without collection or OCR
        type: boolean
        default: false
      saved_paper_document_ids:
        description: Comma-separated canonical document UUIDs to replay (at most 12); requires saved replay
        required: false
        default: ''
permissions:
  contents: write
jobs:
  archive-pages:
    if: ${{ !inputs.replay_saved_paper }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: disclosure-source-writer
      cancel-in-progress: false
    env:
      SENATE_EFD_COLLECTION_ENABLED: ${{ vars.SENATE_EFD_COLLECTION_ENABLED }}
      SENATE_EFD_TERMS_ACKNOWLEDGED: ${{ vars.SENATE_EFD_TERMS_ACKNOWLEDGED }}
    steps:
      - name: Validate fresh mode selection
        env:
          SAVED_PAPER_DOCUMENT_IDS: ${{ inputs.saved_paper_document_ids }}
        run: |
          if [[ -n "${SAVED_PAPER_DOCUMENT_IDS:-}" ]]; then
            echo 'Saved document selection requires explicit saved replay.' >&2
            exit 2
          fi
      - uses: actions/checkout@v7
        with:
          ref: code
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install fixed paper slot image reader
        run: |
          python -m pip install Pillow==12.3.0
          python -c "from PIL import Image; print(Image.__version__)"
      - name: Prepare immutable evidence and review inputs
        id: trees
        run: |
          evidence_root="$RUNNER_TEMP/senate-paper-evidence"
          review_root="$RUNNER_TEMP/senate-paper-review"
          state_root="$RUNNER_TEMP/senate-paper-state"
          git fetch --no-tags origin \
            evidence:refs/remotes/origin/evidence \
            review:refs/remotes/origin/review \
            state:refs/remotes/origin/state
          git worktree add --detach "$evidence_root" origin/evidence
          git worktree add --detach "$review_root" origin/review
          git worktree add --detach "$state_root" origin/state
          echo "evidence_root=$evidence_root" >> "$GITHUB_OUTPUT"
          echo "review_root=$review_root" >> "$GITHUB_OUTPUT"
          echo "state_root=$state_root" >> "$GITHUB_OUTPUT"
      - name: Archive the complete current paper page set
        env:
          EVIDENCE_ROOT: ${{ steps.trees.outputs.evidence_root }}
          REVIEW_ROOT: ${{ steps.trees.outputs.review_root }}
        run: |
          mkdir -p .local
          PYTHONPATH=backend/src python -m unison_snapshot senate-efd-gate \
            --output .local/senate-paper-gate.json
          PYTHONPATH=backend/src python -m unison_snapshot archive-senate-paper-pages \
            --evidence-root "$EVIDENCE_ROOT" \
            --review-root "$REVIEW_ROOT" \
            --expected-documents 9 \
            --expected-pages 52 \
            --output .local/senate-paper-page-batch.json
          python - <<'PY'
          import json
          from pathlib import Path
          batch = json.loads(Path('.local/senate-paper-page-batch.json').read_text(encoding='utf-8'))
          if (batch['document_count'], batch['page_count'],
                  batch['evidence_complete']) != (9, 52, True):
              raise SystemExit('Senate paper PTR page evidence is incomplete')
          PY
      - name: Install bounded OCR engine
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 tesseract-ocr
          tesseract --version | head -1
      - name: Extract all archived paper reports
        env:
          EVIDENCE_ROOT: ${{ steps.trees.outputs.evidence_root }}
          REVIEW_ROOT: ${{ steps.trees.outputs.review_root }}
        run: |
          PYTHONPATH=backend/src python -m unison_snapshot extract-senate-paper-pages \
            --evidence-root "$EVIDENCE_ROOT" \
            --review-root "$REVIEW_ROOT" \
            --output .local/senate-paper-extraction-batch.json
          python - <<'PY'
          import json
          from pathlib import Path
          batch = json.loads(Path('.local/senate-paper-extraction-batch.json').read_text(encoding='utf-8'))
          if batch['report_count'] != 9 or batch['extraction_count'] + batch['failure_count'] != 9:
              raise SystemExit('Every Senate paper report must have an extraction or explicit failure')
          PY
      - name: Observe physical grid slots against legacy extraction
        env:
          EVIDENCE_ROOT: ${{ steps.trees.outputs.evidence_root }}
          REVIEW_ROOT: ${{ steps.trees.outputs.review_root }}
        run: |
          PYTHONPATH=backend/src python backend/scripts/observe_senate_paper_slots.py \
            --evidence-root "$EVIDENCE_ROOT" \
            --docs-root docs \
            --extraction-batch .local/senate-paper-extraction-batch.json \
            --output "$REVIEW_ROOT/senate_efd/paper_slot_observations/current.json" \
            --pending-output "$REVIEW_ROOT/senate_efd/paper_pending_projections/current.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['REVIEW_ROOT'])
          observed = json.loads((root / 'senate_efd/paper_slot_observations/current.json')
                                .read_text(encoding='utf-8'))
          if observed['report_count'] != 9:
              raise SystemExit('Senate paper slot observation lost a report')
          if observed['observed_page_count'] + observed['unobserved_page_count'] != 52:
              raise SystemExit('Senate paper slot observation lost page coverage')
          if sum(observed['label_counts'].values()) != observed['physical_grid_slot_count']:
              raise SystemExit('Senate paper slot observation failed conservation')
          pending = json.loads((root / 'senate_efd/paper_pending_projections/current.json')
                               .read_text(encoding='utf-8'))
          if pending['pending_row_count'] != observed['label_counts']['data_observed']:
              raise SystemExit('Senate paper pending projection lost observed data slots')
          if pending['unknown_slot_count'] != observed['label_counts']['unknown']:
              raise SystemExit('Senate paper pending projection lost unknown slots')
          PY
      - name: Qualify fixed source-bound first paper report
        env:
          EVIDENCE_ROOT: ${{ steps.trees.outputs.evidence_root }}
          REVIEW_ROOT: ${{ steps.trees.outputs.review_root }}
        run: |
          PYTHONPATH=backend/src python -m unison_snapshot correct-reviewed-senate-paper \
            --batch .local/senate-paper-extraction-batch.json \
            --pending "$REVIEW_ROOT/senate_efd/paper_pending_projections/current.json" \
            --correction backend/data/corrections/senate_efd/068274e1-4b7a-4453-a242-563dde4c10d8.json \
            --evidence-root "$EVIDENCE_ROOT" \
            --output .local/senate-paper-qualified-batch.json
          mv .local/senate-paper-qualified-batch.json .local/senate-paper-extraction-batch.json
      - name: Qualify second fixed source-bound paper report
        env:
          EVIDENCE_ROOT: ${{ steps.trees.outputs.evidence_root }}
          REVIEW_ROOT: ${{ steps.trees.outputs.review_root }}
        run: |
          PYTHONPATH=backend/src python -m unison_snapshot correct-reviewed-senate-paper \
            --batch .local/senate-paper-extraction-batch.json \
            --pending "$REVIEW_ROOT/senate_efd/paper_pending_projections/current.json" \
            --correction backend/data/corrections/senate_efd/3a4c5095-028a-4614-a692-836719da4e63.json \
            --evidence-root "$EVIDENCE_ROOT" \
            --output .local/senate-paper-second-qualified-batch.json
          mv .local/senate-paper-second-qualified-batch.json .local/senate-paper-extraction-batch.json
      - name: Publish immutable paper page evidence
        env:
          EVIDENCE_ROOT: ${{ steps.trees.outputs.evidence_root }}
        run: |
          git -C "$EVIDENCE_ROOT" add senate_efd/paper_pages
          if git -C "$EVIDENCE_ROOT" diff --cached --quiet; then
            echo "All 52 Senate paper pages were already archived."
          else
            git -C "$EVIDENCE_ROOT" config user.name "github-actions[bot]"
            git -C "$EVIDENCE_ROOT" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$EVIDENCE_ROOT" commit -m "evidence: Senate paper PTR pages ${{ github.run_id }}"
            git -C "$EVIDENCE_ROOT" push origin HEAD:refs/heads/evidence
          fi
      - name: Publish paper extraction dispositions
        env:
          EVIDENCE_ROOT: ${{ steps.trees.outputs.evidence_root }}
          REVIEW_ROOT: ${{ steps.trees.outputs.review_root }}
          STATE_ROOT: ${{ steps.trees.outputs.state_root }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          batch = json.loads(Path('.local/senate-paper-extraction-batch.json').read_text(encoding='utf-8'))
          review = Path(os.environ['REVIEW_ROOT'])
          state = Path(os.environ['STATE_ROOT'])
          parser = batch['parser_version']
          for item in batch['extractions']:
              target = (review / 'senate_efd' / 'extractions' / item['document_id'] /
                        item['source_sha256'] / f'{parser}.json')
              target.parent.mkdir(parents=True, exist_ok=True)
              content = json.dumps(item, ensure_ascii=False, sort_keys=True, separators=(',', ':'))
              if target.is_file() and target.read_text(encoding='utf-8') != content:
                  raise SystemExit(f'Immutable Senate paper extraction collision: {target}')
              target.write_text(content, encoding='utf-8')
          failure_root = review / 'senate_efd' / 'paper_report_failures'
          for item in batch['failures']:
              target = failure_root / item['document_id'] / item['source_sha256'] / f'{parser}.json'
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(json.dumps(item, ensure_ascii=False, sort_keys=True,
                                           separators=(',', ':')), encoding='utf-8')
          for item in batch['extractions']:
              if item.get('qualification_basis') == 'fixed_source_visual_review_v1':
                  stale = failure_root / item['document_id'] / item['source_sha256'] / f'{parser}.json'
                  if stale.is_file():
                      stale.unlink()
          extraction_paths = list((review / 'senate_efd' / 'extractions').glob(f'*/*/{parser}.json'))
          extractions = [json.loads(path.read_text(encoding='utf-8')) for path in extraction_paths]
          transaction_count = sum(len(item.get('transactions', [])) for item in extractions)
          electronic_failures = len(list((review / 'senate_efd' / 'report_failures').glob(
              f'*/*/{parser}.json')))
          paper_failures = len(batch['failures'])
          status_path = review / 'status' / 'senate_efd.json'
          status = json.loads(status_path.read_text(encoding='utf-8'))
          status.update({
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'report_evidence_count': len(extractions),
              'report_extraction_failure_count': electronic_failures + paper_failures,
              'extracted_transaction_count': transaction_count,
              'paper_report_count': batch['report_count'],
              'paper_extraction_count': batch['extraction_count'],
              'paper_extraction_failure_count': paper_failures,
              'paper_eligible_transaction_count': batch['eligible_transaction_count'],
              'paper_quarantined_transaction_count': batch['quarantined_transaction_count'],
              'detail': (f"{status['report_entrypoint_count']} PTR entrypoints archived; "
                         f"{len(extractions)} reports parsed into {transaction_count} transactions; "
                         f"{paper_failures + electronic_failures} current-parser failures remain."),
          })
          status_path.write_text(json.dumps(status, ensure_ascii=False, sort_keys=True,
                                            separators=(',', ':')), encoding='utf-8')
          state_path = state / 'status' / 'senate_efd.json'
          state_status = json.loads(state_path.read_text(encoding='utf-8'))
          state_status['run_at'] = datetime.now(timezone.utc).isoformat()
          state_status['reports'].update({
              'evidence_count': len(extractions),
              'last_batch_extractions': batch['extraction_count'],
              'last_batch_extraction_failures': electronic_failures + paper_failures,
              'last_batch_transactions': transaction_count,
              'paper_report_count': batch['report_count'],
              'paper_extraction_count': batch['extraction_count'],
              'paper_quarantined_transaction_count': batch['quarantined_transaction_count'],
          })
          state_path.write_text(json.dumps(state_status, ensure_ascii=False, sort_keys=True,
                                           separators=(',', ':')), encoding='utf-8')
          PY
          git -C "$STATE_ROOT" add status/senate_efd.json
          git -C "$STATE_ROOT" config user.name "github-actions[bot]"
          git -C "$STATE_ROOT" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git -C "$STATE_ROOT" diff --cached --quiet; then
            git -C "$STATE_ROOT" commit -m "state: Senate paper extraction ${{ github.run_id }}"
            git -C "$STATE_ROOT" push origin HEAD:refs/heads/state
          fi
          git -C "$REVIEW_ROOT" add -A senate_efd/extractions senate_efd/paper_report_failures senate_efd/paper_slot_observations senate_efd/paper_pending_projections status/senate_efd.json
          git -C "$REVIEW_ROOT" config user.name "github-actions[bot]"
          git -C "$REVIEW_ROOT" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git -C "$REVIEW_ROOT" diff --cached --quiet; then
            git -C "$REVIEW_ROOT" commit -m "review: Senate paper extraction ${{ github.run_id }}"
            git -C "$REVIEW_ROOT" push origin HEAD:refs/heads/review
          fi
          PYTHONPATH=backend/src python -m unison_snapshot build-senate-candidate \
            --evidence-root "$EVIDENCE_ROOT" \
            --review-root "$REVIEW_ROOT" \
            --state-status "$STATE_ROOT/status/senate_efd.json" \
            --base ingest/current.json \
            --output "$RUNNER_TEMP/senate-paper-shadow-candidate.json" \
            --audit-output "$RUNNER_TEMP/senate-paper-shadow-audit.json" \
            --html-output "$RUNNER_TEMP/senate-paper-shadow.html"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['REVIEW_ROOT'])
          shadow = json.loads((Path(os.environ['RUNNER_TEMP']) /
                               'senate-paper-shadow-audit.json').read_text(encoding='utf-8'))
          pending = json.loads((root / 'senate_efd/paper_pending_projections/current.json')
                               .read_text(encoding='utf-8'))
          audit = shadow.get('paper_pending_projection')
          if (not isinstance(audit, dict) or
                  audit['physical_slot_count'] != pending['pending_row_count'] or
                  audit['unknown_slot_count'] != pending['unknown_slot_count'] or
                  audit['qualified_transaction_count'] != 82 or
                  audit['remaining_pending_row_count'] != pending['pending_row_count'] - 82):
              raise SystemExit('Senate paper pending slots did not reach shadow candidate audit')
          print(json.dumps({'pending_physical_slots_in_builder': audit['physical_slot_count'],
                            'unknown_physical_slots_in_builder': audit['unknown_slot_count'],
                            'source_bound_qualified_transactions': 82}, sort_keys=True))
          PY
          failures="$(python -c "import json; print(json.load(open('.local/senate-paper-extraction-batch.json'))['failure_count'])")"
          echo "$failures Senate paper reports remain in explicit failure isolation."
      - name: Rebuild Senate and unified disclosure candidates
        env:
          EVIDENCE_ROOT: ${{ steps.trees.outputs.evidence_root }}
          REVIEW_ROOT: ${{ steps.trees.outputs.review_root }}
          STATE_ROOT: ${{ steps.trees.outputs.state_root }}
        run: |
          mkdir -p "$REVIEW_ROOT/candidates/sources"
          PYTHONPATH=backend/src python -m unison_snapshot build-senate-candidate \
            --evidence-root "$EVIDENCE_ROOT" \
            --review-root "$REVIEW_ROOT" \
            --state-status "$STATE_ROOT/status/senate_efd.json" \
            --base ingest/current.json \
            --output "$REVIEW_ROOT/candidates/sources/senate_efd-current.json" \
            --audit-output "$REVIEW_ROOT/senate_efd/qualifications/current.json" \
            --html-output "$RUNNER_TEMP/senate-paper-current.html"
          source_args=(--source "senate_efd=$REVIEW_ROOT/candidates/sources/senate_efd-current.json")
          for source in house_clerk oge; do
            path="$REVIEW_ROOT/candidates/sources/$source-current.json"
            if [ -f "$path" ]; then source_args+=(--source "$source=$path"); fi
          done
          PYTHONPATH=backend/src python -m unison_snapshot build-disclosure-candidate \
            --base ingest/current.json --harmonize-cutoffs "${source_args[@]}" \
            --output "$REVIEW_ROOT/candidates/disclosure-current.json" \
            --audit-output "$REVIEW_ROOT/status/disclosure_cutoff.json" \
            --html-output "$RUNNER_TEMP/disclosure-current.html"
          git -C "$REVIEW_ROOT" add candidates senate_efd/qualifications status/disclosure_cutoff.json
          if ! git -C "$REVIEW_ROOT" diff --cached --quiet; then
            git -C "$REVIEW_ROOT" commit -m "review: rebuild candidates with Senate paper PTRs ${{ github.run_id }}"
            git -C "$REVIEW_ROOT" push origin HEAD:refs/heads/review
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: senate-paper-page-batch-${{ github.run_id }}
          path: |
            .local/senate-paper-page-batch.json
            .local/senate-paper-extraction-batch.json
          retention-days: 1
  replay-saved:
    if: ${{ inputs.replay_saved_paper }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: disclosure-source-writer
      cancel-in-progress: false
    steps:
      - name: Validate saved replay selection
        env:
          SAVED_PAPER_DOCUMENT_IDS: ${{ inputs.saved_paper_document_ids }}
        run: |
          python - <<'PY'
          import os, re
          raw = os.environ.get('SAVED_PAPER_DOCUMENT_IDS', '')
          ids = raw.split(',')
          if (not raw or len(raw) > 12 * 37 or len(ids) > 12 or len(set(ids)) != len(ids)
                  or any(not re.fullmatch('[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}', value) for value in ids)):
              raise SystemExit('Saved replay requires 1-12 unique canonical document UUIDs')
          PY
      - uses: actions/checkout@v7
        with:
          ref: code
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install fixed saved paper reader
        run: python -m pip install Pillow==12.3.0
      - name: Prepare existing saved replay trees
        id: trees
        run: |
          evidence_root="$RUNNER_TEMP/senate-saved-paper-evidence"
          review_root="$RUNNER_TEMP/senate-saved-paper-review"
          state_root="$RUNNER_TEMP/senate-saved-paper-state"
          git fetch --no-tags origin \
            evidence:refs/remotes/origin/evidence \
            review:refs/remotes/origin/review \
            state:refs/remotes/origin/state
          git worktree add --detach "$evidence_root" origin/evidence
          git worktree add --detach "$review_root" origin/review
          git worktree add --detach "$state_root" origin/state
          echo "evidence_root=$evidence_root" >> "$GITHUB_OUTPUT"
          echo "review_root=$review_root" >> "$GITHUB_OUTPUT"
          echo "state_root=$state_root" >> "$GITHUB_OUTPUT"
      - name: Prepare and consume selected saved paper inputs
        env:
          EVIDENCE_ROOT: ${{ steps.trees.outputs.evidence_root }}
          REVIEW_ROOT: ${{ steps.trees.outputs.review_root }}
          SAVED_PAPER_DOCUMENT_IDS: ${{ inputs.saved_paper_document_ids }}
        run: |
          mkdir -p .local
          saved_args=()
          IFS=, read -r -a documents <<< "$SAVED_PAPER_DOCUMENT_IDS"
          for document_id in "${documents[@]}"; do saved_args+=(--document-id "$document_id"); done
          PYTHONPATH=backend/src python backend/scripts/prepare_senate_paper_runtime.py \
            --evidence-root "$EVIDENCE_ROOT" --review-root "$REVIEW_ROOT" \
            "${saved_args[@]}" --grid-output .local/senate-saved-grids.json \
            --word-output .local/senate-saved-words.json --receipt-output .local/senate-saved-receipt.json
          PYTHONPATH=backend/src python -m unison_snapshot extract-senate-paper-pages \
            --evidence-root "$EVIDENCE_ROOT" --review-root "$REVIEW_ROOT" \
            --saved-grid-observations .local/senate-saved-grids.json \
            --saved-word-pages .local/senate-saved-words.json --tesseract __OCR_DISABLED__ \
            --output .local/senate-saved-extraction-batch.json
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          evidence, review = Path(os.environ['EVIDENCE_ROOT']), Path(os.environ['REVIEW_ROOT'])
          selected = set(os.environ['SAVED_PAPER_DOCUMENT_IDS'].split(','))
          batch = json.loads(Path('.local/senate-saved-extraction-batch.json').read_text(encoding='utf-8'))
          if (batch.get('scope') != 'selected_fixed_reports_not_full_catalog'
                  or batch['failure_count'] != 0 or batch['report_count'] != len(selected)
                  or {row['document_id'] for row in batch['extractions']} != selected):
              raise SystemExit('Saved replay must conserve every selected report without failures')
          for row in batch['extractions']:
              path = review / 'senate_efd/extractions' / row['document_id'] / row['source_sha256'] / (row['parser_version'] + '.json')
              if json.loads(path.read_text(encoding='utf-8')) != row:
                  raise SystemExit('Saved replay differs from its existing complete extraction')
          receipt = json.loads(Path('.local/senate-saved-receipt.json').read_text(encoding='utf-8'))
          for item in receipt['files']:
              path = (review if item['root'] == 'review' else evidence) / item['path']
              if hashlib.sha256(path.read_bytes()).hexdigest() != item['sha256']:
                  raise SystemExit('Saved replay changed an archived input or global source status')
          PY
      - name: Build candidates from existing source state
        env:
          EVIDENCE_ROOT: ${{ steps.trees.outputs.evidence_root }}
          REVIEW_ROOT: ${{ steps.trees.outputs.review_root }}
          STATE_ROOT: ${{ steps.trees.outputs.state_root }}
        run: |
          # Keep global source counts, readiness and watermarks unchanged.
          mkdir -p "$REVIEW_ROOT/candidates/sources"
          PYTHONPATH=backend/src python -m unison_snapshot build-senate-candidate \
            --evidence-root "$EVIDENCE_ROOT" --review-root "$REVIEW_ROOT" \
            --state-status "$STATE_ROOT/status/senate_efd.json" --base ingest/current.json \
            --output "$REVIEW_ROOT/candidates/sources/senate_efd-current.json" \
            --audit-output "$REVIEW_ROOT/senate_efd/qualifications/current.json" \
            --html-output "$RUNNER_TEMP/senate-saved-paper-current.html"
          source_args=(--source "senate_efd=$REVIEW_ROOT/candidates/sources/senate_efd-current.json")
          for source in house_clerk oge; do
            path="$REVIEW_ROOT/candidates/sources/$source-current.json"
            if [ -f "$path" ]; then source_args+=(--source "$source=$path"); fi
          done
          PYTHONPATH=backend/src python -m unison_snapshot build-disclosure-candidate \
            --base ingest/current.json --harmonize-cutoffs "${source_args[@]}" \
            --output "$REVIEW_ROOT/candidates/disclosure-current.json" \
            --audit-output "$REVIEW_ROOT/status/disclosure_cutoff.json" \
            --html-output "$RUNNER_TEMP/senate-saved-disclosure-current.html"
      - name: Publish replayed review candidates
        env:
          REVIEW_ROOT: ${{ steps.trees.outputs.review_root }}
        run: |
          git -C "$REVIEW_ROOT" add candidates senate_efd/qualifications status/disclosure_cutoff.json
          if ! git -C "$REVIEW_ROOT" diff --cached --quiet; then
            git -C "$REVIEW_ROOT" config user.name "github-actions[bot]"
            git -C "$REVIEW_ROOT" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$REVIEW_ROOT" commit -m "review: replay selected Senate paper inputs ${{ github.run_id }}"
            git -C "$REVIEW_ROOT" push origin HEAD:refs/heads/review
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: senate-saved-paper-replay-${{ github.run_id }}
          path: .local/senate-saved-*.json
          retention-days: 1
