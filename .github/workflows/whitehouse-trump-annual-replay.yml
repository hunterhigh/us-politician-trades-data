name: Replay fixed Trump 2025 annual report

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay-review:
    concurrency:
      group: disclosure-source-writer
      cancel-in-progress: false
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOCUMENT_ID: wh-url:0c14d3849ca60768024e470b
      SOURCE_SHA256: 1cc7951c6f72fab008e921903c9a1d03d41a9910239f954e208b501d608553a3
      TARGET_PARSER_SLUG: whitehouse-278e-hybrid-geometry-v8
      LEGACY_TREE: c57ecdcd0e780fa7dc256fae6d0fe728735c8f09
      LEGACY_AUDIT_SHA256: 291eec853889ebcb102187a7f876fcd624270f33f0bcc5108dd42c90611a995b
    steps:
      - uses: actions/checkout@v7
        with:
          ref: code
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install PDF parser
        run: python -m pip install -e 'backend[house-ingest]'
      - name: Prepare immutable evidence and review trees
        id: trees
        run: |
          git fetch --no-tags origin evidence review
          evidence_root="$RUNNER_TEMP/trump-replay-evidence"
          review_root="$RUNNER_TEMP/trump-replay-review"
          git worktree add --detach "$evidence_root" origin/evidence
          git worktree add --detach "$review_root" origin/review
          echo "evidence_root=$evidence_root" >> "$GITHUB_OUTPUT"
          echo "review_root=$review_root" >> "$GITHUB_OUTPUT"
          echo "review_base=$(git -C "$review_root" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Pin and verify the complete read-only v5 checkpoint tree
        env:
          REVIEW_ROOT: ${{ steps.trees.outputs.review_root }}
          PYTHONPATH: backend/src
        run: |
          legacy_path="whitehouse/ocr-checkpoints/${DOCUMENT_ID#wh-url:}/$SOURCE_SHA256/whitehouse-278e-hybrid-geometry-v5"
          test "$(git -C "$REVIEW_ROOT" rev-parse "HEAD:$legacy_path")" = "$LEGACY_TREE"
          python backend/scripts/audit_trump_ocr_checkpoints.py \
            --root "$REVIEW_ROOT/$legacy_path" \
            --output "$RUNNER_TEMP/checkpoint-before.json"
          test "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["audit_sha256"])' "$RUNNER_TEMP/checkpoint-before.json")" = "$LEGACY_AUDIT_SHA256"
      - name: Replay only the fixed source from the 38 legacy shards
        env:
          EVIDENCE_ROOT: ${{ steps.trees.outputs.evidence_root }}
          REVIEW_ROOT: ${{ steps.trees.outputs.review_root }}
          PYTHONPATH: backend/src
        run: |
          python backend/scripts/whitehouse_extract.py \
            --evidence-root "$EVIDENCE_ROOT" --review-root "$REVIEW_ROOT" \
            --limit 1 --ocr-page-limit 25 \
            --document-id "$DOCUMENT_ID" --source-sha256 "$SOURCE_SHA256" \
            --status-output "$REVIEW_ROOT/whitehouse/annual/trump-2025-replay-status.json"
      - name: Enforce row conservation, account deduplication, and no checkpoint writes
        env:
          REVIEW_ROOT: ${{ steps.trees.outputs.review_root }}
          PYTHONPATH: backend/src
        run: |
          base="whitehouse/ocr-checkpoints/${DOCUMENT_ID#wh-url:}/$SOURCE_SHA256"
          legacy_path="$base/whitehouse-278e-hybrid-geometry-v5"
          target_checkpoint_path="$base/$TARGET_PARSER_SLUG"
          test ! -e "$REVIEW_ROOT/$target_checkpoint_path"
          test -z "$(git -C "$REVIEW_ROOT" status --porcelain --untracked-files=all -- "$legacy_path")"
          test "$(git -C "$REVIEW_ROOT" rev-parse "HEAD:$legacy_path")" = "$LEGACY_TREE"
          python backend/scripts/audit_trump_ocr_checkpoints.py \
            --root "$REVIEW_ROOT/$legacy_path" \
            --output "$RUNNER_TEMP/checkpoint-after.json"
          cmp "$RUNNER_TEMP/checkpoint-before.json" "$RUNNER_TEMP/checkpoint-after.json"
          extraction="$REVIEW_ROOT/whitehouse/extractions/${DOCUMENT_ID#wh-url:}/$SOURCE_SHA256/$TARGET_PARSER_SLUG.json"
          python backend/scripts/audit_trump_annual_replay.py \
            --input "$extraction" \
            --output "$REVIEW_ROOT/whitehouse/annual/trump-2025-replay-audit.json" \
            --legacy-tree "$LEGACY_TREE" \
            --legacy-audit-sha256 "$LEGACY_AUDIT_SHA256"
      - name: Rebuild review indexes from the verified extraction
        env:
          REVIEW_ROOT: ${{ steps.trees.outputs.review_root }}
          PYTHONPATH: backend/src
        run: |
          python backend/scripts/whitehouse_coverage.py --review-root "$REVIEW_ROOT"
          python backend/scripts/build_whitehouse_reported_index.py --review-root "$REVIEW_ROOT"
          python backend/scripts/build_whitehouse_annual_review.py --review-root "$REVIEW_ROOT"
      - name: Publish only the verified review replay
        env:
          REVIEW_ROOT: ${{ steps.trees.outputs.review_root }}
          REVIEW_BASE: ${{ steps.trees.outputs.review_base }}
        run: |
          remote_review="$(git ls-remote origin refs/heads/review | cut -f1)"
          test "$remote_review" = "$REVIEW_BASE" || {
            echo "review moved during replay; refusing stale publication" >&2
            exit 1
          }
          git -C "$REVIEW_ROOT" add \
            "whitehouse/extractions/${DOCUMENT_ID#wh-url:}/$SOURCE_SHA256/$TARGET_PARSER_SLUG.json" \
            whitehouse/coverage-current.json \
            whitehouse/filer-reported-current.json \
            whitehouse/annual/filer-reported-current.json \
            whitehouse/annual/trump-2025-replay-audit.json \
            whitehouse/annual/trump-2025-replay-status.json
          if ! git -C "$REVIEW_ROOT" diff --cached --quiet; then
            git -C "$REVIEW_ROOT" config user.name "github-actions[bot]"
            git -C "$REVIEW_ROOT" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$REVIEW_ROOT" commit -m "review: fixed Trump annual replay ${{ github.run_id }}"
            git -C "$REVIEW_ROOT" push origin HEAD:refs/heads/review
          fi
