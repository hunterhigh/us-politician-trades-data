name: Offline contract checks
on:
  push:
    branches: [code]
    paths: ['contract/**', 'backend/**', 'client/**', 'frontend-e2e/**', 'review-input/**', '.github/**', 'runtime/**', 'docs/**', 'README.md', 'AGENTS.md']
  pull_request:
    paths: ['contract/**', 'backend/**', 'client/**', 'frontend-e2e/**', 'review-input/**', '.github/**', 'runtime/**', 'docs/**', 'README.md', 'AGENTS.md']
  schedule:
    - cron: '43 18 * * *'
  workflow_dispatch:
    inputs:
      build_runtime:
        description: Build and smoke-test the fixed OCR/Python runtime before pinning its digest
        type: boolean
        default: false
      house_2025_backfill:
        description: After successful checks, execute the authorized fixed 2025 House PTR replay
        type: boolean
        default: false
permissions:
  packages: read
  contents: read
concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Demo, golden reports and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/hunterhigh/us-politician-trades-data-runtime@sha256:c15f99ffa11f27a814aee26328977ab5691954b469baa4932d56706aef1cd9e4
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - name: Activate fixed source runtime
        uses: ./.github/actions/setup-source
      - name: Compile, reconstruct demo and replay golden reports
        run: python backend/tests/golden/run.py --regenerate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-golden-answers
          path: backend/tests/golden/**/expected.json
          retention-days: 1
      - name: Check frozen upstream processor contracts
        run: python -m unittest discover -s review-input/us-politician-trades-watch/tests -v
      - uses: ./.github/actions/setup-browser
      - run: npm test
        working-directory: frontend-e2e
  verify:
    if: always()
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Require successful offline checks
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
  fixed-house-replay:
    if: github.event_name == 'workflow_dispatch' && inputs.house_2025_backfill
    needs: verify
    permissions:
      packages: read
      contents: write
      issues: write
    uses: ./.github/workflows/replay.yml
    with:
      source: house
      mode: backfill
      limit: '25'
      archive_budget_seconds: '900'
  build-runtime:
    if: github.event_name == 'workflow_dispatch' && inputs.build_runtime
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate the repository runtime registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build, verify and publish the dependency-only runtime
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python runtime/build.py --image "ghcr.io/${REPOSITORY,,}-runtime" \
            --tag "$GITHUB_SHA" --receipt .local/runtime-build.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-runtime-build
          path: .local/runtime-build.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
