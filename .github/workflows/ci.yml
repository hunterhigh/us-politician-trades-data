name: Offline contract checks
on:
  push:
    branches: [code]
    paths: ['backend/**', 'client/**', 'gateway/**', 'review-input/**', '.github/workflows/**']
  pull_request:
    paths: ['backend/**', 'client/**', 'gateway/**', 'review-input/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/verify.py
        working-directory: backend
      - run: python backend/scripts/demo.py
      - run: python -m unittest discover -s review-input/us-politician-trades-watch/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
        working-directory: gateway
      - run: npm test
        working-directory: gateway
      - run: npm run typecheck
        working-directory: gateway
      - run: npm run types:check
        working-directory: gateway
