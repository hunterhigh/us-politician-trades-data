name: Senate amendment history resolve
on:
  workflow_dispatch:
    inputs:
      submitted_start_date:
        description: Earliest official catalog submission date to inspect
        required: true
        default: '2024-01-01'
        type: string
permissions:
  contents: write
jobs:
  collect:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: disclosure-source-writer
      cancel-in-progress: false
    env:
      SENATE_EFD_COLLECTION_ENABLED: ${{ vars.SENATE_EFD_COLLECTION_ENABLED }}
      SENATE_EFD_TERMS_ACKNOWLEDGED: ${{ vars.SENATE_EFD_TERMS_ACKNOWLEDGED }}
      HISTORY_START_DATE: ${{ inputs.submitted_start_date }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: code
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Prepare immutable evidence and current review inputs
        id: trees
        run: |
          evidence_root="$RUNNER_TEMP/senate-history-evidence"
          review_root="$RUNNER_TEMP/senate-history-review"
          git fetch --no-tags origin \
            evidence:refs/remotes/origin/evidence \
            review:refs/remotes/origin/review
          git worktree add --detach "$evidence_root" origin/evidence
          git worktree add --detach "$review_root" origin/review
          echo "evidence_root=$evidence_root" >> "$GITHUB_OUTPUT"
          echo "review_root=$review_root" >> "$GITHUB_OUTPUT"
      - name: Rebuild and verify the bounded 16-document whitelist
        env:
          EVIDENCE_ROOT: ${{ steps.trees.outputs.evidence_root }}
          REVIEW_ROOT: ${{ steps.trees.outputs.review_root }}
        run: |
          mkdir -p .local
          PYTHONPATH=backend/src python -m unison_snapshot senate-efd-gate \
            --output .local/senate-history-gate.json
          PYTHONPATH=backend/src python -m unison_snapshot discover-senate-efd \
            --archive "$EVIDENCE_ROOT" \
            --submitted-start-date "$HISTORY_START_DATE" \
            --output .local/senate-history-discovery.json
          roster_sha="$(REVIEW_ROOT="$REVIEW_ROOT" python - <<'PY'
          import json, os
          from pathlib import Path
          status = json.loads((Path(os.environ['REVIEW_ROOT']) / 'status' / 'senate_efd.json').read_text(encoding='utf-8'))
          print(status['identity_roster_sha256'])
          PY
          )"
          congress_roster_sha="$(REVIEW_ROOT="$REVIEW_ROOT" python - <<'PY'
          import json, os
          from pathlib import Path
          status = json.loads((Path(os.environ['REVIEW_ROOT']) / 'status' / 'senate_efd.json').read_text(encoding='utf-8'))
          print(status.get('identity_congress_roster_sha256', ''))
          PY
          )"
          identity_args=()
          if [ -n "$congress_roster_sha" ]; then
            congress_roster="$EVIDENCE_ROOT/senate_efd/congress_members/$congress_roster_sha/roster.json"
            test -f "$congress_roster"
            identity_args+=(--congress-roster "$congress_roster")
          fi
          PYTHONPATH=backend/src python -m unison_snapshot match-senate-catalog \
            --discovery .local/senate-history-discovery.json \
            --roster "$EVIDENCE_ROOT/senate_efd/members/$roster_sha.roster.json" \
            "${identity_args[@]}" \
            --output .local/senate-history-identities.json
          PYTHONPATH=backend/src python -m unison_snapshot plan-senate-amendment-backfill \
            --review-root "$REVIEW_ROOT" \
            --historical-discovery .local/senate-history-discovery.json \
            --historical-identities .local/senate-history-identities.json \
            --expected-target-count 12 \
            --output .local/senate-amendment-history-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path('.local/senate-amendment-history-plan.json').read_text(encoding='utf-8'))
          counts = [target['candidate_count'] for target in plan['targets']]
          expected_shape = (
              plan['status'] == 'attention' and
              plan['reasons'] == ['predecessor_not_unique'] and
              plan['target_count'] == 12 and
              counts.count(1) == 8 and counts.count(2) == 4 and
              len(plan['candidate_document_ids']) == 16 and
              len(set(plan['candidate_document_ids'])) == 16
          )
          if not expected_shape:
              raise SystemExit('Historical amendment whitelist shape changed; refusing download')
          Path('.local/senate-history-candidate-ids.json').write_text(
              json.dumps(plan['candidate_document_ids'], separators=(',', ':')), encoding='utf-8')
          PY
      - name: Archive only the 16 plan-bound official entrypoints
        env:
          EVIDENCE_ROOT: ${{ steps.trees.outputs.evidence_root }}
        run: |
          PYTHONPATH=backend/src python -m unison_snapshot archive-senate-report-entrypoints \
            --discovery .local/senate-history-discovery.json \
            --document-ids .local/senate-history-candidate-ids.json \
            --archive "$EVIDENCE_ROOT" \
            --limit 16 \
            --output .local/senate-history-report-batch.json
          python - <<'PY'
          import json
          from pathlib import Path
          batch = json.loads(Path('.local/senate-history-report-batch.json').read_text(encoding='utf-8'))
          if (batch['selected_record_count'], batch['archived_total'], batch['pending_count'],
                  batch['failure_count']) != (16, 16, 0, 0):
              raise SystemExit('Historical report whitelist was not archived completely')
          PY
      - name: Publish immutable historical catalog and report evidence
        env:
          EVIDENCE_ROOT: ${{ steps.trees.outputs.evidence_root }}
        run: |
          git -C "$EVIDENCE_ROOT" add senate_efd/catalog senate_efd/reports
          if ! git -C "$EVIDENCE_ROOT" diff --cached --quiet; then
            git -C "$EVIDENCE_ROOT" config user.name "github-actions[bot]"
            git -C "$EVIDENCE_ROOT" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$EVIDENCE_ROOT" commit -m "evidence: Senate amendment predecessors ${{ github.run_id }}"
            git -C "$EVIDENCE_ROOT" push origin HEAD:refs/heads/evidence
          fi
      - name: Parse the archived whitelist offline
        env:
          EVIDENCE_ROOT: ${{ steps.trees.outputs.evidence_root }}
        run: |
          PYTHONPATH=backend/src python -m unison_snapshot extract-senate-report-entrypoints \
            --batch .local/senate-history-report-batch.json \
            --archive "$EVIDENCE_ROOT" \
            --output .local/senate-history-extraction-batch.json
          python - <<'PY'
          import json
          from pathlib import Path
          batch = json.loads(Path('.local/senate-history-extraction-batch.json').read_text(encoding='utf-8'))
          if (batch['entrypoint_count'], batch['extraction_count'], batch['inspection_count'],
                  batch['failure_count']) != (16, 16, 0, 0):
              raise SystemExit('Historical report whitelist did not parse completely')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: senate-amendment-history-inputs-${{ github.run_id }}
          path: |
            .local/senate-history-discovery.json
            .local/senate-history-identities.json
            .local/senate-amendment-history-plan.json
            .local/senate-history-candidate-ids.json
            .local/senate-history-report-batch.json
            .local/senate-history-extraction-batch.json
          retention-days: 1
  resolve:
    needs: collect
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: disclosure-source-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: code
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: senate-amendment-history-inputs-${{ github.run_id }}
          path: .local
      - name: Prepare immutable current review inputs
        id: review
        run: |
          review_root="$RUNNER_TEMP/senate-history-review"
          git fetch --no-tags origin review:refs/remotes/origin/review
          git worktree add --detach "$review_root" origin/review
          echo "root=$review_root" >> "$GITHUB_OUTPUT"
      - name: Resolve every predecessor by official report contents
        env:
          REVIEW_ROOT: ${{ steps.review.outputs.root }}
        run: |
          PYTHONPATH=backend/src python -m unison_snapshot resolve-senate-amendment-backfill \
            --review-root "$REVIEW_ROOT" \
            --plan .local/senate-amendment-history-plan.json \
            --historical-extractions .local/senate-history-extraction-batch.json \
            --output .local/senate-amendment-supplement.json
      - uses: actions/upload-artifact@v4
        with:
          name: senate-amendment-supplement-${{ github.run_id }}
          path: .local/senate-amendment-supplement.json
          retention-days: 1
      - name: Require one content-matched predecessor per amendment
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          supplement = json.loads(Path('.local/senate-amendment-supplement.json').read_text(encoding='utf-8'))
          if (supplement['status'], supplement['target_count'],
                  supplement['selected_predecessor_count']) != ('ready', 12, 12):
              raise SystemExit(f"Historical amendment supplement needs attention: {supplement['reasons']}")
          print('Resolved 12 amendment predecessors from 16 bounded official reports.')
          PY
  activate:
    needs: resolve
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: disclosure-source-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: code
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: senate-amendment-history-inputs-${{ github.run_id }}
          path: .local
      - uses: actions/download-artifact@v4
        with:
          name: senate-amendment-supplement-${{ github.run_id }}
          path: .local
      - name: Prepare review and state snapshots
        id: trees
        run: |
          review_root="$RUNNER_TEMP/senate-history-review"
          state_root="$RUNNER_TEMP/senate-history-state"
          git fetch --no-tags origin \
            review:refs/remotes/origin/review \
            state:refs/remotes/origin/state
          git worktree add --detach "$review_root" origin/review
          git worktree add --detach "$state_root" origin/state
          echo "review_root=$review_root" >> "$GITHUB_OUTPUT"
          echo "state_root=$state_root" >> "$GITHUB_OUTPUT"
      - name: Activate the immutable supplement and rebuild candidates
        env:
          REVIEW_ROOT: ${{ steps.trees.outputs.review_root }}
          STATE_ROOT: ${{ steps.trees.outputs.state_root }}
        run: |
          PYTHONPATH=backend/src python -m unison_snapshot activate-senate-amendment-supplement \
            --review-root "$REVIEW_ROOT" \
            --supplement .local/senate-amendment-supplement.json \
            --historical-extractions .local/senate-history-extraction-batch.json \
            --output .local/senate-amendment-supplement-pointer.json
          status="$REVIEW_ROOT/status/senate_efd.json"
          catalog_sha="$(python -c "import json; print(json.load(open('$status'))['catalog_sha256'])")"
          identity_binding="$(python -c "import json; print(json.load(open('$status'))['identity_binding_sha256'])")"
          parser_version="$(python -c "import json; print(json.load(open('$status'))['report_parser_version'])")"
          audit_temp="$RUNNER_TEMP/senate-efd-qualification.json"
          mkdir -p "$REVIEW_ROOT/candidates/sources"
          PYTHONPATH=backend/src python -m unison_snapshot build-senate-candidate \
            --review-root "$REVIEW_ROOT" \
            --state-status "$STATE_ROOT/status/senate_efd.json" \
            --base ingest/current.json \
            --output "$REVIEW_ROOT/candidates/sources/senate_efd-current.json" \
            --audit-output "$audit_temp" \
            --html-output "$RUNNER_TEMP/senate-efd-current.html"
          AUDIT="$audit_temp" CANDIDATE="$REVIEW_ROOT/candidates/sources/senate_efd-current.json" \
            SUPPLEMENT=".local/senate-amendment-supplement.json" python - <<'PY'
          import json, os
          from pathlib import Path
          audit = json.loads(Path(os.environ['AUDIT']).read_text(encoding='utf-8'))
          candidate = json.loads(Path(os.environ['CANDIDATE']).read_text(encoding='utf-8'))
          supplement = json.loads(Path(os.environ['SUPPLEMENT']).read_text(encoding='utf-8'))
          if (audit['input_transaction_count'] != 1646 or
                  audit['amendment_supplement_sha256'] != supplement['supplement_sha256'] or
                  audit['amendment_supplement_report_count'] != 12 or
                  audit['candidate_transaction_count'] + audit['quarantined_transaction_count'] +
                  audit['superseded_report_transaction_count'] != 1646):
              raise SystemExit('Activated Senate amendment supplement failed primary conservation')
          predecessor_ids = set(supplement['selected_document_ids'])
          if any(item.get('filing_id') in predecessor_ids for item in candidate['transactions']):
              raise SystemExit('Historical predecessor escaped into the candidate transaction set')
          PY
          builder_version="$(python -c "import json; print(json.load(open('$audit_temp'))['builder_version'])")"
          candidate_snapshot="$(python -c "import json; print(json.load(open('$audit_temp'))['candidate_snapshot_id'])")"
          audit="$REVIEW_ROOT/senate_efd/qualifications/$catalog_sha/$identity_binding/$parser_version/$builder_version/$candidate_snapshot.json"
          mkdir -p "$(dirname "$audit")"
          if [ -e "$audit" ] && ! cmp -s "$audit_temp" "$audit"; then
            echo "Immutable Senate qualification audit collision: $audit" >&2
            exit 1
          fi
          cp "$audit_temp" "$audit"
          cp "$audit_temp" "$REVIEW_ROOT/senate_efd/qualifications/current.json"
          source_args=(--source "senate_efd=$REVIEW_ROOT/candidates/sources/senate_efd-current.json")
          if [ -f "$REVIEW_ROOT/candidates/sources/house_clerk-current.json" ]; then
            source_args+=(--source "house_clerk=$REVIEW_ROOT/candidates/sources/house_clerk-current.json")
          fi
          PYTHONPATH=backend/src python -m unison_snapshot build-disclosure-candidate \
            --base ingest/current.json \
            --harmonize-cutoffs \
            "${source_args[@]}" \
            --output "$REVIEW_ROOT/candidates/disclosure-current.json" \
            --audit-output "$REVIEW_ROOT/status/disclosure_cutoff.json" \
            --html-output "$RUNNER_TEMP/disclosure-current.html"
          CANDIDATE="$REVIEW_ROOT/candidates/disclosure-current.json" \
            BUILDER_COMMIT="${{ github.sha }}" python - <<'PY'
          import json, os
          from pathlib import Path
          candidate = json.loads(Path(os.environ['CANDIDATE']).read_text(encoding='utf-8'))
          disclosure_sources = {'house_clerk', 'senate_efd', 'oge'}
          included = sorted(row['source_id'] for row in candidate['source_health']
                            if row.get('source_id') in disclosure_sources
                            and row.get('status') in {'ok', 'partial'})
          value = {
              'schema_version': 'disclosure-candidate-run/v1',
              'builder_commit': os.environ['BUILDER_COMMIT'],
              'data_cutoff_at': candidate['meta']['data_cutoff_at'],
              'included_sources': included,
              'pending_sources': sorted(disclosure_sources - set(included)),
              'people_count': len(candidate['people']),
              'transaction_count': len(candidate['transactions']),
              'reported_holding_count': len(candidate['reported_holdings']),
              'status': 'partial',
              'cutoff_audit': 'status/disclosure_cutoff.json',
          }
          target = Path(os.environ['REVIEW_ROOT']) / 'status' / 'disclosure_candidate.json'
          target.write_text(json.dumps(value, ensure_ascii=False, sort_keys=True,
                                       separators=(',', ':')), encoding='utf-8')
          PY
      - name: Publish the validated review supplement and candidates
        env:
          REVIEW_ROOT: ${{ steps.trees.outputs.review_root }}
        run: |
          git -C "$REVIEW_ROOT" add \
            senate_efd/amendment_supplements \
            senate_efd/qualifications \
            candidates \
            status/disclosure_candidate.json \
            status/disclosure_cutoff.json
          if git -C "$REVIEW_ROOT" diff --cached --quiet; then
            echo "Activated supplement produced no review change" >&2
            exit 1
          fi
          git -C "$REVIEW_ROOT" config user.name "github-actions[bot]"
          git -C "$REVIEW_ROOT" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$REVIEW_ROOT" commit -m "review: activate Senate amendment supplement ${{ github.run_id }}"
          git -C "$REVIEW_ROOT" push origin HEAD:refs/heads/review
