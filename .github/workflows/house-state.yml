name: House source state
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: Maximum number of pending House PTR PDFs to archive in this run
        required: false
        default: '10'
permissions:
  contents: write
concurrency:
  group: house-source-state
  cancel-in-progress: false
jobs:
  checkpoint:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Set run coordinates
        id: clock
        run: |
          echo "year=$(date -u +%Y)" >> "$GITHUB_OUTPUT"
          echo "run_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Load previous public checkpoint
        env:
          YEAR: ${{ steps.clock.outputs.year }}
        run: |
          mkdir -p .local
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch --no-tags origin state
            git show "FETCH_HEAD:checkpoints/house/${YEAR}.json" > .local/previous.json || true
          fi
      - name: Prepare immutable evidence branch
        id: evidence
        run: |
          evidence_root="$RUNNER_TEMP/house-evidence"
          remote_evidence="$(git ls-remote --heads origin evidence | awk '{print $1}')"
          if [ -n "$remote_evidence" ]; then
            git fetch --no-tags origin evidence
            git worktree add --detach "$evidence_root" "$remote_evidence"
          else
            git worktree add --detach "$evidence_root" HEAD
            git -C "$evidence_root" switch --orphan evidence
            git -C "$evidence_root" rm -rf . >/dev/null 2>&1 || true
          fi
          cat > "$evidence_root/README.md" <<'EOF'
          # Production source evidence

          This branch is the immutable public evidence layer for official source files.
          House index ZIPs and PTR PDFs are stored under `house_clerk/` by SHA-256 together with retrieval metadata.
          Normalized frontend data remains on `main`; operational checkpoints remain on `state`.
          Credentials and unreviewed extracted rows are never stored here.
          EOF
          echo "root=$evidence_root" >> "$GITHUB_OUTPUT"
      - name: Discover official House index
        env:
          YEAR: ${{ steps.clock.outputs.year }}
          EVIDENCE_ROOT: ${{ steps.evidence.outputs.root }}
        run: |
          PYTHONPATH=backend/src python -m unison_snapshot discover-house-index \
            --year "$YEAR" --archive "$EVIDENCE_ROOT" --output .local/discovery.json
      - name: Discover official House member roster
        env:
          EVIDENCE_ROOT: ${{ steps.evidence.outputs.root }}
        run: |
          PYTHONPATH=backend/src python -m unison_snapshot discover-house-members \
            --archive "$EVIDENCE_ROOT" --output .local/house-members.json
          roster_sha="$(python -c "import json; print(json.load(open('.local/house-members.json'))['metadata']['sha256'])")"
          cp .local/house-members.json "$EVIDENCE_ROOT/house_clerk/members/${roster_sha}.roster.json"
      - name: Build recoverable checkpoint
        env:
          RUN_AT: ${{ steps.clock.outputs.run_at }}
          EVIDENCE_ROOT: ${{ steps.evidence.outputs.root }}
        run: |
          previous=()
          if [ -s .local/previous.json ]; then
            previous+=(--checkpoint .local/previous.json)
          fi
          PYTHONPATH=backend/src python -m unison_snapshot plan-house-ptr-sync \
            --discovery .local/discovery.json --archive "$EVIDENCE_ROOT" \
            --planned-at "$RUN_AT" --output .local/checkpoint.json "${previous[@]}"
      - name: Archive bounded House PTR evidence batch
        env:
          YEAR: ${{ steps.clock.outputs.year }}
          EVIDENCE_ROOT: ${{ steps.evidence.outputs.root }}
          BATCH_SIZE: ${{ inputs.batch_size || vars.HOUSE_ARCHIVE_BATCH_SIZE || '10' }}
        run: |
          case "$BATCH_SIZE" in
            ''|*[!0-9]*) echo "batch_size must be an integer" >&2; exit 2 ;;
          esac
          test "$BATCH_SIZE" -ge 1 && test "$BATCH_SIZE" -le 25 || {
            echo "batch_size must be between 1 and 25" >&2
            exit 2
          }
          index_sha="$(python -c "import json; print(json.load(open('.local/checkpoint.json'))['index_sha256'])")"
          python - "$BATCH_SIZE" > .local/batch.txt <<'PY'
          import json, sys
          checkpoint = json.load(open('.local/checkpoint.json', encoding='utf-8'))
          for document_id in checkpoint['queue'][:int(sys.argv[1])]:
              print(document_id)
          PY
          archived=0
          failed=0
          while IFS= read -r document_id; do
            [ -n "$document_id" ] || continue
            rm -f .local/archive-result.json .local/checkpoint.next.json
            if output="$(PYTHONPATH=backend/src python -m unison_snapshot archive-house-ptr \
                --year "$YEAR" --index-sha "$index_sha" --document-id "$document_id" \
                --archive "$EVIDENCE_ROOT" --output .local/archive-result.json 2>&1)"; then
              PYTHONPATH=backend/src python -m unison_snapshot record-house-ptr-result \
                --checkpoint .local/checkpoint.json --document-id "$document_id" --status archived \
                --metadata .local/archive-result.json --result-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --output .local/checkpoint.next.json
              archived=$((archived + 1))
            else
              error="$(printf '%s' "$output" | tr '\n' ' ' | tail -c 480)"
              PYTHONPATH=backend/src python -m unison_snapshot record-house-ptr-result \
                --checkpoint .local/checkpoint.json --document-id "$document_id" --status failed \
                --error "$error" --result-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --output .local/checkpoint.next.json
              failed=$((failed + 1))
            fi
            mv .local/checkpoint.next.json .local/checkpoint.json
            sleep 1
          done < .local/batch.txt
          printf 'Archived %s House PTR PDFs; %s downloads failed.\n' "$archived" "$failed" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish immutable evidence branch
        env:
          EVIDENCE_ROOT: ${{ steps.evidence.outputs.root }}
        run: |
          git -C "$EVIDENCE_ROOT" add README.md house_clerk
          if git -C "$EVIDENCE_ROOT" diff --cached --quiet; then
            echo "Evidence is unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -C "$EVIDENCE_ROOT" config user.name "github-actions[bot]"
          git -C "$EVIDENCE_ROOT" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$EVIDENCE_ROOT" commit -m "evidence: House ${{ steps.clock.outputs.year }} ${{ steps.clock.outputs.run_at }}"
          git -C "$EVIDENCE_ROOT" push origin HEAD:refs/heads/evidence
          evidence_sha="$(git -C "$EVIDENCE_ROOT" rev-parse HEAD)"
          printf 'Published immutable evidence commit `%s`.\n' "$evidence_sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Build public run status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          checkpoint = json.loads(Path('.local/checkpoint.json').read_text(encoding='utf-8'))
          status = {
              'schema_version': 'house-source-run/v1',
              'source_id': 'house_clerk',
              'filing_year': checkpoint['filing_year'],
              'index_sha256': checkpoint['index_sha256'],
              'run_at': checkpoint['planned_at'],
              'counts': checkpoint['counts'],
              'queue_count': len(checkpoint['queue']),
              'anomaly_count': len(checkpoint['anomalies']),
              'status': 'attention' if checkpoint['anomalies'] else 'ok',
          }
          Path('.local/last-run.json').write_text(
              json.dumps(status, ensure_ascii=False, sort_keys=True, separators=(',', ':')),
              encoding='utf-8')
          PY
      - name: Publish state branch
        env:
          YEAR: ${{ steps.clock.outputs.year }}
        run: |
          state_root="$RUNNER_TEMP/house-state"
          remote_state="$(git ls-remote --heads origin state | awk '{print $1}')"
          if [ -n "$remote_state" ]; then
            git fetch --no-tags origin state
            git worktree add --detach "$state_root" "$remote_state"
          else
            git worktree add --detach "$state_root" HEAD
            git -C "$state_root" switch --orphan state
          fi
          mkdir -p "$state_root/checkpoints/house" "$state_root/status"
          cp .local/checkpoint.json "$state_root/checkpoints/house/${YEAR}.json"
          cp .local/last-run.json "$state_root/status/last-run.json"
          cat > "$state_root/README.md" <<'EOF'
          # Production state

          This branch contains public operational checkpoints and source health only.
          Raw official evidence is stored on the `evidence` branch. Production snapshot shards are stored on `main`.
          This branch does not contain credentials or unreviewed extracted rows.
          EOF
          git -C "$state_root" add README.md checkpoints status
          if git -C "$state_root" diff --cached --quiet; then
            echo "State is unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -C "$state_root" config user.name "github-actions[bot]"
          git -C "$state_root" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$state_root" commit -m "state: House ${YEAR} ${{ steps.clock.outputs.run_at }}"
          git -C "$state_root" push origin HEAD:refs/heads/state
          printf 'Published House %s checkpoint to `state`.\n' "$YEAR" >> "$GITHUB_STEP_SUMMARY"
