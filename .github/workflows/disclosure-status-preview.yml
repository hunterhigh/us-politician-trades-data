name: Disclosure status fixed-input preview
on:
  pull_request:
    paths:
      - 'backend/**/disclosure_status*'
      - 'backend/scripts/*disclosure_status*'
      - 'backend/src/unison_snapshot/public_repo.py'
      - 'backend/src/unison_snapshot/materialize.py'
      - 'backend/src/unison_snapshot/__main__.py'
      - '.github/workflows/disclosure-status-preview.yml'
      - '.github/workflows/publish-complete.yml'
      - '.github/scripts/prepare-publication-trees.sh'
      - 'backend/scripts/*publication_source_scope.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: status-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Prepare frozen existing source trees
        run: |
          git fetch --no-tags --depth=1 origin \
            evidence:refs/remotes/origin/evidence \
            review:refs/remotes/origin/review \
            main:refs/remotes/origin/main
          git worktree add --detach "$RUNNER_TEMP/status-evidence" origin/evidence
          git worktree add --detach "$RUNNER_TEMP/status-review" origin/review
          git worktree add --detach "$RUNNER_TEMP/status-main" origin/main
      - name: Compare full and scoped publication inputs
        env:
          PYTHONPATH: backend/src
        run: |
          python backend/scripts/verify_publication_source_scope.py --keep-parser-inputs \
            --evidence-root "$RUNNER_TEMP/status-evidence" \
            --review-root "$RUNNER_TEMP/status-review" \
            --main-root "$RUNNER_TEMP/status-main" \
            --code-commit "$(git rev-parse HEAD)" \
            --output-dir "$RUNNER_TEMP/disclosure-status-preview"
      - uses: actions/upload-artifact@v4
        with:
          name: disclosure-status-preview-${{ github.run_id }}
          path: ${{ runner.temp }}/disclosure-status-preview
          if-no-files-found: error
          retention-days: 30
