name: Prepare licensed market data

on:
  schedule:
    - cron: '30 22 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: Refresh price handoff, audit coverage, or inspect account usage
        type: choice
        options: [refresh, audit, usage]
        default: refresh
      batch_size:
        description: Alpaca symbols per request
        default: '100'
      twelve_data_limit:
        description: Twelve Data symbols to advance; 0 reuses published prices
        default: '100'
      audit_limit:
        description: Maximum Alpaca-unpriced tickers to audit (1-100)
        default: '30'
      cache_main_ref:
        description: Optional published main commit for cache recovery
        default: ''
      cache_market_ref:
        description: Matching published market commit for cache recovery
        default: ''

permissions:
  packages: read
  contents: read

jobs:
  refresh:
    if: github.ref == 'refs/heads/code' && (github.event_name == 'schedule' || inputs.mode == 'refresh')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: prepare-market-refresh
      queue: max
      cancel-in-progress: false
    container: &source_runtime
      image: ghcr.io/hunterhigh/us-politician-trades-data-runtime@sha256:c15f99ffa11f27a814aee26328977ab5691954b469baa4932d56706aef1cd9e4
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Enforce scheduled publication switch
        if: github.event_name == 'schedule'
        env:
          ENABLED: ${{ vars.COMPLETE_PUBLICATION_ENABLED }}
        run: test "$ENABLED" = "true"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Activate fixed source runtime
        uses: ./.github/actions/setup-source
      - name: Enforce licensed production gate
        env:
          AUTHORIZED: ${{ vars.MARKET_DISTRIBUTION_AUTHORIZED }}
          KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          TWELVE_AUTHORIZED: ${{ vars.TWELVE_DATA_DISTRIBUTION_AUTHORIZED }}
          TWELVE_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          BATCH_SIZE: ${{ inputs.batch_size || vars.MARKET_BATCH_SIZE || '100' }}
          TWELVE_LIMIT: ${{ inputs.twelve_data_limit || '100' }}
          CACHE_MAIN_REF: ${{ inputs.cache_main_ref }}
          CACHE_MARKET_REF: ${{ inputs.cache_market_ref }}
        run: |
          test "$AUTHORIZED" = "true" || {
            echo "MARKET_DISTRIBUTION_AUTHORIZED must be true in production." >&2
            exit 2
          }
          test -n "$KEY_ID" && test -n "$SECRET_KEY" || {
            echo "Alpaca production credentials are not configured." >&2
            exit 2
          }
          test "$TWELVE_AUTHORIZED" = "true" || {
            echo "Twelve Data distribution authorization is missing." >&2
            exit 2
          }
          case "$BATCH_SIZE" in *[!0-9]*) exit 2 ;; esac
          test "$BATCH_SIZE" -ge 1 && test "$BATCH_SIZE" -le 200
          case "$TWELVE_LIMIT" in *[!0-9]*) exit 2 ;; esac
          test "$TWELVE_LIMIT" -ge 0 && test "$TWELVE_LIMIT" -le 100
          if [ "$TWELVE_LIMIT" -gt 0 ] && [ -z "$TWELVE_KEY" ]; then
            echo "Twelve Data credential is required when advancing its cache." >&2
            exit 2
          fi
          if { [ -z "$CACHE_MAIN_REF" ] && [ -n "$CACHE_MARKET_REF" ]; } \
              || { [ -n "$CACHE_MAIN_REF" ] && [ -z "$CACHE_MARKET_REF" ]; }; then
            echo "Cache recovery requires both main and market commits." >&2
            exit 2
          fi
          if [ -n "$CACHE_MAIN_REF" ]; then
            [[ "$CACHE_MAIN_REF" =~ ^[0-9a-f]{40}$ ]]
            [[ "$CACHE_MARKET_REF" =~ ^[0-9a-f]{40}$ ]]
          fi
      - name: Prepare fixed source and publication trees
        id: trees
        env:
          CACHE_MAIN_OVERRIDE: ${{ inputs.cache_main_ref }}
          CACHE_MARKET_OVERRIDE: ${{ inputs.cache_market_ref }}
        run: bash .github/scripts/prepare-publication-trees.sh
      - name: Build canonical disclosure projection from qualified sources
        env:
          REVIEW_ROOT: ${{ steps.trees.outputs.review_root }}
          PYTHONPATH: backend/src
        run: |
          python -m unison_snapshot build-disclosure-candidate \
            --base backend/data/empty-disclosure.json --harmonize-cutoffs \
            --source "house_clerk=$REVIEW_ROOT/candidates/sources/house_clerk-current.json" \
            --source "oge=$REVIEW_ROOT/candidates/sources/oge-current.json" \
            --source "senate_efd=$REVIEW_ROOT/candidates/sources/senate_efd-current.json" \
            --output "$RUNNER_TEMP/governed-disclosure.json" \
            --audit-output "$RUNNER_TEMP/governed-cutoff.json"
      - name: Build licensed five-array candidate
        env:
          REVIEW_ROOT: ${{ steps.trees.outputs.review_root }}
          CACHE_MAIN_ROOT: ${{ steps.trees.outputs.cache_main_root }}
          CACHE_MARKET_ROOT: ${{ steps.trees.outputs.cache_market_root }}
          CACHE_MARKET_COMMIT: ${{ steps.trees.outputs.cache_market_commit }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_ASSETS_URL: ${{ vars.ALPACA_ASSETS_URL }}
          BATCH_SIZE: ${{ inputs.batch_size || vars.MARKET_BATCH_SIZE || '100' }}
          PYTHONPATH: backend/src
        run: |
          checked_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          assets_url="${ALPACA_ASSETS_URL:-https://paper-api.alpaca.markets/v2/assets}"
          python -m unison_snapshot build-alpaca-market-validation \
            --input "$RUNNER_TEMP/governed-disclosure.json" \
            --output "$RUNNER_TEMP/complete-candidate.json" \
            --audit-output "$RUNNER_TEMP/market-audit.json" \
            --checked-at "$checked_at" --batch-size "$BATCH_SIZE" \
            --assets-url "$assets_url" \
            --previous-main-root "$CACHE_MAIN_ROOT" \
            --previous-market-root "$CACHE_MARKET_ROOT" \
            --previous-market-commit "$CACHE_MARKET_COMMIT" \
            --distribution-authorized
      - name: Reuse or advance licensed Twelve Data daily prices
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TWELVE_LIMIT: ${{ inputs.twelve_data_limit || '100' }}
          PYTHONPATH: backend/src
        run: |
          checked_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python -m unison_snapshot build-twelve-data-supplement \
            --input "$RUNNER_TEMP/complete-candidate.json" \
            --output "$RUNNER_TEMP/complete-candidate.json" \
            --audit-output "$RUNNER_TEMP/twelve-audit.json" \
            --checked-at "$checked_at" --limit "$TWELVE_LIMIT" \
            --previous-main-root "${{ steps.trees.outputs.cache_main_root }}" \
            --previous-market-root "${{ steps.trees.outputs.cache_market_root }}" \
            --previous-market-commit "${{ steps.trees.outputs.cache_market_commit }}" \
            --distribution-authorized
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          audit = json.loads((root / 'twelve-audit.json').read_text(encoding='utf-8'))
          print('Twelve Data transport:', json.dumps(audit['transport'], sort_keys=True))
          print('Twelve Data history:', json.dumps(audit['history_counts'], sort_keys=True))
          print(f"Twelve Data scheduling: new {audit['new_selected_count']}/{audit['new_due_count']}; refresh {audit['refresh_selected_count']}/{audit['refresh_due_count']}; deferred new {audit['new_deferred_count']}, refresh {audit['refresh_deferred_count']}")
          if audit['accepted_count'] < 1:
              raise SystemExit('No qualified Twelve Data price series; preserving the last publication')
          PY
      - name: Save price-only handoff
        env:
          MARKET_BASE: ${{ steps.trees.outputs.market_base }}
        run: |
          python - <<'PY'
          import gzip, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          value = json.loads((root / 'complete-candidate.json').read_text())
          prices = {key: value[key] for key in ('meta', 'security_market_data', 'source_health')}
          (root / 'prices.json.gz').write_bytes(gzip.compress(json.dumps(prices, separators=(',', ':')).encode(), compresslevel=1))
          (root / 'market-base.txt').write_text(os.environ['MARKET_BASE'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prepared-prices-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/prices.json.gz
            ${{ runner.temp }}/market-base.txt
            ${{ runner.temp }}/market-audit.json
            ${{ runner.temp }}/twelve-audit.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
  audit:
    if: github.ref == 'refs/heads/code' && github.event_name == 'workflow_dispatch' && inputs.mode != 'refresh'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: twelve-data-market-audit
      queue: max
      cancel-in-progress: false
    container: *source_runtime
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Activate fixed source runtime
        uses: ./.github/actions/setup-source
      - name: Verify access and authorization
        env:
          ALPACA_AUTHORIZED: ${{ vars.MARKET_DISTRIBUTION_AUTHORIZED }}
          TWELVE_AUTHORIZED: ${{ vars.TWELVE_DATA_DISTRIBUTION_AUTHORIZED }}
          ALPACA_KEY: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_SECRET: ${{ secrets.ALPACA_API_SECRET_KEY }}
          TWELVE_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          LIMIT: ${{ inputs.audit_limit }}
        run: |
          test "$ALPACA_AUTHORIZED" = true && test "$TWELVE_AUTHORIZED" = true
          test -n "$ALPACA_KEY" && test -n "$ALPACA_SECRET" && test -n "$TWELVE_KEY"
          case "$LIMIT" in *[!0-9]*|'') exit 2 ;; esac
          test "$LIMIT" -ge 1 && test "$LIMIT" -le 100
      - name: Check Twelve Data account capacity
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python - <<'PY' | tee "$GITHUB_STEP_SUMMARY"
          import json, os, urllib.request
          request=urllib.request.Request(
              'https://api.twelvedata.com/api_usage',
              headers={'Authorization': 'apikey '+os.environ['TWELVE_DATA_API_KEY'],
                       'Accept': 'application/json'})
          with urllib.request.urlopen(request, timeout=20) as response:
              value=json.load(response)
          fields=('plan_category','plan_limit','current_usage',
                  'plan_daily_limit','daily_usage')
          print('### Twelve Data account capacity')
          for field in fields:
              if field in value:
                  print(f'- {field}: {value[field]}')
          PY
      - name: Prepare fixed production trees
        if: inputs.mode != 'usage'
        id: trees
        run: |
          git fetch --no-tags origin review main market
          git worktree add --detach "$RUNNER_TEMP/review" origin/review
          git worktree add --detach "$RUNNER_TEMP/main" origin/main
          git worktree add --detach "$RUNNER_TEMP/market" origin/market
          echo "market_base=$(git -C "$RUNNER_TEMP/market" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Rebuild Alpaca candidate from licensed cache
        if: inputs.mode != 'usage'
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          PYTHONPATH: backend/src
          MARKET_BASE: ${{ steps.trees.outputs.market_base }}
        run: |
          checked_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python -m unison_snapshot build-alpaca-market-validation \
            --input "$RUNNER_TEMP/review/candidates/disclosure-current.json" \
            --output "$RUNNER_TEMP/alpaca-candidate.json" \
            --audit-output "$RUNNER_TEMP/alpaca-audit.json" \
            --checked-at "$checked_at" \
            --previous-main-root "$RUNNER_TEMP/main" \
            --previous-market-root "$RUNNER_TEMP/market" \
            --previous-market-commit "$MARKET_BASE" \
            --distribution-authorized
      - name: Check Twelve Data without publication
        if: inputs.mode != 'usage'
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          PYTHONPATH: backend/src
          LIMIT: ${{ inputs.audit_limit }}
          MARKET_BASE: ${{ steps.trees.outputs.market_base }}
        run: |
          checked_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python -m unison_snapshot build-twelve-data-supplement \
            --input "$RUNNER_TEMP/alpaca-candidate.json" \
            --output "$RUNNER_TEMP/twelve-candidate.json" \
            --audit-output "$RUNNER_TEMP/twelve-audit.json" \
            --checked-at "$checked_at" --limit "$LIMIT" \
            --previous-main-root "$RUNNER_TEMP/main" \
            --previous-market-root "$RUNNER_TEMP/market" \
            --previous-market-commit "$MARKET_BASE" \
            --distribution-authorized
      - name: Summarize coverage
        if: inputs.mode != 'usage'
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          root=os.environ['RUNNER_TEMP']
          audit=json.load(open(root+'/twelve-audit.json'))
          from collections import Counter
          counts=Counter(row['status'] for row in audit['results'])
          print('### Twelve Data coverage audit')
          print(f"Attempted: {audit['attempted_count']}; newly accepted: {audit['new_accepted_count']}")
          print(f"Cached accepted: {audit['cached_accepted_count']}; cumulative accepted: {audit['accepted_count']}")
          print(f"Deferred backlog: {audit['backlog_count']}; requests: {audit['request_count']}")
          print(f"Exact duplicate rows removed: {audit['deduplicated_row_count']}")
          for status,count in sorted(counts.items()):
              print(f"- {status}: {count}")
          print('No market data was published by this run.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.mode != 'usage'
        with:
          name: twelve-data-coverage-audit
          path: ${{ runner.temp }}/twelve-audit.json
          retention-days: 14
