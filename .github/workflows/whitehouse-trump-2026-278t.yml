name: Replay all Trump 2026 278-T reports

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay-review:
    concurrency:
      group: disclosure-source-writer
      cancel-in-progress: false
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TARGET_PARSER_SLUG: whitehouse-278t-hybrid-geometry-v4
    steps:
      - uses: actions/checkout@v7
        with:
          ref: code
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install PDF parser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 tesseract-ocr
          tesseract --version | head -1
          python -m pip install -e 'backend[house-ingest]'
      - name: Prepare immutable evidence and review trees
        id: trees
        run: |
          git fetch --no-tags origin evidence review
          evidence_root="$RUNNER_TEMP/trump-2026-evidence"
          review_root="$RUNNER_TEMP/trump-2026-review"
          git worktree add --detach "$evidence_root" origin/evidence
          git worktree add --detach "$review_root" origin/review
          echo "evidence_root=$evidence_root" >> "$GITHUB_OUTPUT"
          echo "review_root=$review_root" >> "$GITHUB_OUTPUT"
          echo "review_base=$(git -C "$review_root" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Replay nine OCR results and checkpoint the 113-page report
        env:
          EVIDENCE_ROOT: ${{ steps.trees.outputs.evidence_root }}
          REVIEW_ROOT: ${{ steps.trees.outputs.review_root }}
          PYTHONPATH: backend/src
        run: |
          set -euo pipefail
          while read -r document_id source_sha256; do
            suffix="${document_id#wh-url:}"
            status="$REVIEW_ROOT/whitehouse/278t/trump-2026-$suffix-status.json"
            python backend/scripts/whitehouse_extract.py \
              --evidence-root "$EVIDENCE_ROOT" --review-root "$REVIEW_ROOT" \
              --limit 1 --ocr-page-limit 100 \
              --document-id "$document_id" --source-sha256 "$source_sha256" \
              --status-output "$status"
            target="$REVIEW_ROOT/whitehouse/extractions/$suffix/$source_sha256/$TARGET_PARSER_SLUG.json"
            if test "$document_id" = "wh-url:11b77506f8e46ae1a83b0531" && ! test -f "$target"; then
              python backend/scripts/whitehouse_extract.py \
                --evidence-root "$EVIDENCE_ROOT" --review-root "$REVIEW_ROOT" \
                --limit 1 --ocr-page-limit 100 \
                --document-id "$document_id" --source-sha256 "$source_sha256" \
                --status-output "$status"
            fi
            test -f "$target"
          done <<'SOURCES'
          wh-url:62340683e32b0263e8f0eb20 3d2f74d9cc5f1a2a7819e90aea17357b40ddbca9839bf89c8b3f047c6f2e33ce
          wh-url:67a0a1742a0d66c5b2ac23c1 ef2d7f9874d17dee879eae4c2b53d2100d78af42435048ab67f783242daae249
          wh-url:8a81a4571e085ccd51a0e4e6 3eab1c525446546dc921ef4bdc0a60867e7a7b184fc1a8a76cb7be8d4acbdab8
          wh-url:2e543c867ad080888580fa12 795a8dd77ccbf70df3b907cb2b3130ee68a7b2a4d78ccd7b4b59ad0db1569db2
          wh-url:82a263659dcbd44a6522ecbc ecadf5c04b463f4f96dbf01371282e4c0e24d57aee94a4e2cc723a6c87988c31
          wh-url:11b77506f8e46ae1a83b0531 b801eaa58cca980c9c9437ea712880c4c4ec612df1461013662c1f2bc58d3e85
          wh-url:6b1be988199005fdd79af8de 6985cb0f5c3139fc955dc4fe0b4b084b47fb6e97d3a82bc57903f9ce8a229fc9
          wh-url:7e17c4be2b42f563d37df173 a058a3bfc12a1d4e0ab9cfd8b16ac98c1b92ec713ec9d09882319cb9f722668b
          wh-url:01475dee0bcffa4e79f7f58c fca15b5424b1d4591373739aef12955e1375eff7bcac3443ee1d57d0fb610b0a
          wh-url:5e95b7609861d78aa29e3d13 e1ec58ef09d3046f6e2741533df80fe88a1210b3b5c2eaa7a7c74c850bda58ed
          SOURCES
      - name: Verify all ten row dispositions and rebuild review indexes
        env:
          REVIEW_ROOT: ${{ steps.trees.outputs.review_root }}
          PYTHONPATH: backend/src
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["REVIEW_ROOT"])
          paths = list(root.glob("whitehouse/extractions/*/*/whitehouse-278t-hybrid-geometry-v4.json"))
          if len(paths) != 10:
              raise SystemExit(f"expected 10 Trump 2026 v4 reports, found {len(paths)}")
          reports = [json.loads(path.read_text(encoding="utf-8")) for path in paths]
          for report in reports:
              rows = report["transactions"] + report["quarantined"]
              geometry = sorted(row["geometry_row_index"] for row in rows)
              if geometry != list(range(1, len(rows) + 1)):
                  raise SystemExit(f"row conservation failed: {report['document_id']}")
          print(json.dumps({"report_count": len(reports),
                            "source_row_count": sum(r["source_row_count"] for r in reports),
                            "structured_transaction_count": sum(len(r["transactions"]) for r in reports),
                            "quarantined_row_count": sum(len(r["quarantined"]) for r in reports)}))
          PY
          python backend/scripts/whitehouse_coverage.py --review-root "$REVIEW_ROOT"
          python backend/scripts/build_whitehouse_reported_index.py --review-root "$REVIEW_ROOT"
      - name: Publish review without moving production
        env:
          REVIEW_ROOT: ${{ steps.trees.outputs.review_root }}
          REVIEW_BASE: ${{ steps.trees.outputs.review_base }}
        run: |
          remote_review="$(git ls-remote origin refs/heads/review | cut -f1)"
          test "$remote_review" = "$REVIEW_BASE" || {
            echo "review moved during replay; refusing a stale write" >&2
            exit 1
          }
          git -C "$REVIEW_ROOT" add whitehouse/extractions whitehouse/ocr-checkpoints \
            whitehouse/coverage-current.json whitehouse/filer-reported-current.json \
            whitehouse/278t/trump-2026-*-status.json
          if ! git -C "$REVIEW_ROOT" diff --cached --quiet; then
            git -C "$REVIEW_ROOT" config user.name "github-actions[bot]"
            git -C "$REVIEW_ROOT" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$REVIEW_ROOT" commit -m "review: Trump 2026 278-T replay ${{ github.run_id }}"
            git -C "$REVIEW_ROOT" push origin HEAD:refs/heads/review
          fi
