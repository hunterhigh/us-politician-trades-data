name: House source pipeline
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: PTR processing, annual support, or financial-data-preserving amount policy refresh
        type: choice
        options: [ptr, annual, amount-policy]
        default: ptr
      filing_year:
        description: Current filing year, or the authorized fixed 2025 PTR scope
        default: ''
      archive_budget_seconds:
        description: Time budget for draining the indexed archive queue
        default: '900'
      batch_size:
        description: Maximum OCR PTRs to parse; native PDF text reports are unlimited
        default: '25'
      paper_document_id:
        description: Optional existing paper report to replay
        default: ''
      materialize_saved_paper:
        description: Interpret saved paper observations without collection or OCR
        type: boolean
        default: false
  workflow_call:
    inputs:
      mode:
        type: string
        default: 'ptr'
      filing_year:
        type: string
        default: ''
      archive_budget_seconds:
        type: string
        default: '900'
      batch_size:
        type: string
        default: '25'
      paper_document_id:
        type: string
        default: ''
      materialize_saved_paper:
        type: boolean
        default: false
env:
  SENATE_MAX_STALE_DAYS: ${{ vars.SENATE_MAX_STALE_DAYS || '30' }}

permissions:
  packages: read
  contents: write
  issues: write
concurrency:
  group: disclosure-source-writer
  queue: max
  cancel-in-progress: false
jobs:
  source:
    if: inputs.mode != 'annual' && (github.event_name != 'schedule' || github.ref == 'refs/heads/code')
    environment: production
    runs-on: ubuntu-latest
    # Final source validation includes retained 2025 originals and long forms.
    timeout-minutes: 300
    container: &source_runtime
      image: ghcr.io/hunterhigh/us-politician-trades-data-runtime@sha256:c15f99ffa11f27a814aee26328977ab5691954b469baa4932d56706aef1cd9e4
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Activate fixed source runtime
        uses: ./.github/actions/setup-source
        with:
          integrity_scope: house_clerk
      - name: Prepare controlled source data
        id: trees
        uses: ./.github/actions/data-trees
        with:
          scope: house
          workspace: ${{ runner.temp }}/house-source
      - name: Run House source
        env:
          INPUT_YEAR: ${{ inputs.filing_year }}
          INPUT_MODE: ${{ inputs.mode }}
          SAVED_ONLY: ${{ inputs.materialize_saved_paper }}
          EVIDENCE_ROOT: ${{ steps.trees.outputs.evidence_root }}
          REVIEW_ROOT: ${{ steps.trees.outputs.review_root }}
          STATE_ROOT: ${{ steps.trees.outputs.state_root }}
          BUDGET_SECONDS: ${{ inputs.archive_budget_seconds || vars.HOUSE_ARCHIVE_BUDGET_SECONDS || '900' }}
          BATCH_SIZE: ${{ inputs.batch_size || vars.HOUSE_PARSE_BATCH_SIZE || '25' }}
          MATERIALIZE_SAVED_PAPER: ${{ inputs.materialize_saved_paper }}
          PAPER_DOCUMENT_ID: ${{ inputs.paper_document_id }}
          PARSER_COMMIT: ${{ github.sha }}
          CORRECTION_DIR: backend/data/corrections/house_clerk
          PYTHONPATH: backend/src
        run: >-
          python -m unison_snapshot run-house --job source
          --mode "${{ inputs.mode || 'ptr' }}"
          --filing_year "${{ inputs.filing_year }}"
          --archive_budget_seconds "${{ inputs.archive_budget_seconds }}"
          --batch_size "${{ inputs.batch_size }}"
          --paper_document_id "${{ inputs.paper_document_id }}"
          --materialize_saved_paper "${{ inputs.materialize_saved_paper || false }}"
      - name: Reconcile explicit integrity failures
        if: always()
        uses: ./.github/actions/report-integrity
  annual-holdings:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'annual'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: *source_runtime
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Activate fixed source runtime
        uses: ./.github/actions/setup-source
        with:
          integrity_scope: house_clerk
      - name: Prepare controlled annual source data
        id: trees
        uses: ./.github/actions/data-trees
        with:
          scope: house
          workspace: ${{ runner.temp }}/house-annual
      - name: Run House annual-holdings
        env:
          INPUT_YEAR: ${{ inputs.filing_year }}
          INPUT_MODE: ${{ inputs.mode }}
          SAVED_ONLY: ${{ inputs.materialize_saved_paper }}
          EVIDENCE_ROOT: ${{ steps.trees.outputs.evidence_root }}
          REVIEW_ROOT: ${{ steps.trees.outputs.review_root }}
          STATE_ROOT: ${{ steps.trees.outputs.state_root }}
          BUDGET_SECONDS: ${{ inputs.archive_budget_seconds || vars.HOUSE_ARCHIVE_BUDGET_SECONDS || '900' }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          MATERIALIZE_SAVED_PAPER: ${{ inputs.materialize_saved_paper }}
          PAPER_DOCUMENT_ID: ${{ inputs.paper_document_id }}
          PARSER_COMMIT: ${{ github.sha }}
          CORRECTION_DIR: backend/data/corrections/house_clerk
          PYTHONPATH: backend/src
        run: >-
          python -m unison_snapshot run-house --job annual-holdings
          --mode "${{ inputs.mode || 'ptr' }}"
          --filing_year "${{ inputs.filing_year }}"
          --archive_budget_seconds "${{ inputs.archive_budget_seconds }}"
          --batch_size "${{ inputs.batch_size }}"
          --paper_document_id "${{ inputs.paper_document_id }}"
          --materialize_saved_paper "${{ inputs.materialize_saved_paper || false }}"
      - name: Reconcile explicit integrity failures
        if: always()
        uses: ./.github/actions/report-integrity
