name: Senate eFD annual holdings

on:
  schedule:
    - cron: '40 7 * * 1'
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum new annual reports to archive in this run
        required: true
        default: '200'
      structured_asset_labels:
        description: Rebuild structured asset labels from archived annual HTML without collecting new reports
        type: boolean
        default: false
      independent_transactions:
        description: Build independent Part 4b disclosures from archived annual HTML without collecting new reports
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  annual:
    if: github.ref == 'refs/heads/code'
    concurrency:
      group: disclosure-source-writer
      cancel-in-progress: false
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SENATE_EFD_COLLECTION_ENABLED: ${{ vars.SENATE_EFD_COLLECTION_ENABLED }}
      SENATE_EFD_TERMS_ACKNOWLEDGED: ${{ vars.SENATE_EFD_TERMS_ACKNOWLEDGED }}
      REPORT_LIMIT: ${{ inputs.limit || '200' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: code
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check bounded authorized run
        run: |
          test "$GITHUB_REPOSITORY" = hunterhigh/us-politician-trades-data
          test "$SENATE_EFD_COLLECTION_ENABLED" = true
          test "$SENATE_EFD_TERMS_ACKNOWLEDGED" = true
          case "$REPORT_LIMIT" in *[!0-9]*|'') exit 2 ;; esac
          test "$REPORT_LIMIT" -ge 1 && test "$REPORT_LIMIT" -le 300
      - name: Install producer and prepare fixed branches
        run: |
          python -m pip install -e backend
          git fetch --no-tags origin evidence review state
          git worktree add --detach "$RUNNER_TEMP/senate-annual-evidence" origin/evidence
          git worktree add --detach "$RUNNER_TEMP/senate-annual-review" origin/review
          git worktree add --detach "$RUNNER_TEMP/senate-annual-state" origin/state
          roster_sha="$(python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'senate-annual-state'
          print(json.loads((root / 'status/senate_efd.json').read_text())['roster']['sha256'])
          PY
          )"
          roster="$RUNNER_TEMP/senate-annual-evidence/senate_efd/members/$roster_sha.roster.json"
          test -f "$roster"
          echo "ROSTER=$roster" >> "$GITHUB_ENV"
      - name: Discover and archive latest annual versions
        if: inputs.structured_asset_labels != true && inputs.independent_transactions != true
        run: |
          python -m unison_snapshot senate-annual collect \
            --evidence-root "$RUNNER_TEMP/senate-annual-evidence" \
            --roster "$ROSTER" --submitted-start-date 2025-01-01 \
            --limit "$REPORT_LIMIT"
      - name: Publish official originals and catalog
        if: inputs.structured_asset_labels != true && inputs.independent_transactions != true
        run: |
          evidence="$RUNNER_TEMP/senate-annual-evidence"
          git -C "$evidence" add senate_efd/annual
          if ! git -C "$evidence" diff --cached --quiet; then
            git -C "$evidence" config user.name 'github-actions[bot]'
            git -C "$evidence" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C "$evidence" commit -m "evidence: Senate annual reports ${{ github.run_id }}"
            git -C "$evidence" push origin HEAD:refs/heads/evidence
          fi
      - name: Extract and qualify latest annual holdings
        env:
          STRUCTURED_ASSET_LABELS: ${{ inputs.structured_asset_labels }}
          INDEPENDENT_TRANSACTIONS: ${{ inputs.independent_transactions }}
        run: |
          review="$RUNNER_TEMP/senate-annual-review"
          active_mode="$(python - "$review/senate_efd/annual/current.json" <<'PY'
          import json, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          value = json.loads(path.read_text(encoding='utf-8')) if path.is_file() else {}
          if not isinstance(value, dict):
              raise SystemExit('Annual parser selection is invalid')
          mode = value.get('asset_label_mode', 'legacy_v3')
          if mode not in {'legacy_v3', 'structured_v4'}:
              raise SystemExit('Annual parser selection is unsupported')
          print(mode)
          PY
          )"
          annual_args=()
          if [ "$STRUCTURED_ASSET_LABELS" = "true" ] || [ "$active_mode" = "structured_v4" ]; then
            annual_args+=(--structured-asset-labels)
          fi
          active_transactions="$(python - "$review/senate_efd/annual/current.json" <<'PY'
          import json, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          value = json.loads(path.read_text(encoding='utf-8')) if path.is_file() else {}
          mode = value.get('transaction_mode', 'legacy_observations')
          if mode not in {'legacy_observations', 'independent_part4b/v1'}:
              raise SystemExit('Annual transaction selection is unsupported')
          print(mode)
          PY
          )"
          if [ "$INDEPENDENT_TRANSACTIONS" = "true" ] || [ "$active_transactions" = "independent_part4b/v1" ]; then
            annual_args+=(--independent-transactions)
          fi
          python -m unison_snapshot senate-annual build \
            --evidence-root "$RUNNER_TEMP/senate-annual-evidence" \
            --review-root "$review" --roster "$ROSTER" "${annual_args[@]}"
          python -m unison_snapshot senate-annual overlay \
            --review-root "$review" \
            --evidence-root "$RUNNER_TEMP/senate-annual-evidence" \
            --candidate "$review/candidates/sources/senate_efd-current.json" \
            --audit-output "$review/senate_efd/annual/candidate-audit-current.json"
          # Keep the validated Senate source current even when another source's
          # stale cutoff prevents a coherent unified candidate in this run.
          git -C "$review" add senate_efd/annual \
            candidates/sources/senate_efd-current.json
          if ! git -C "$review" diff --cached --quiet; then
            git -C "$review" config user.name 'github-actions[bot]'
            git -C "$review" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C "$review" commit -m "review: Senate annual source candidate ${{ github.run_id }}"
            git -C "$review" push origin HEAD:refs/heads/review
          fi
      - name: Build and validate unified candidate
        id: assembly
        run: |
          review="$RUNNER_TEMP/senate-annual-review"
          source_args=(--source "senate_efd=$review/candidates/sources/senate_efd-current.json")
          for source_id in house_clerk oge; do
            source="$review/candidates/sources/$source_id-current.json"
            if [ -f "$source" ]; then source_args+=(--source "$source_id=$source"); fi
          done
          python -m unison_snapshot build-disclosure-candidate \
            --defer-stale-sources \
            --assembly-status-output "$review/status/disclosure_assembly.json" \
            --base ingest/current.json --harmonize-cutoffs "${source_args[@]}" \
            --output "$review/candidates/disclosure-current.json" \
            --audit-output "$review/status/disclosure_cutoff.json"
          assembly_status="$(PYTHONPATH=backend/src python -m unison_snapshot source-assembly-status \
            --status "$review/status/disclosure_assembly.json")"
          if [ "$assembly_status" = deferred ]; then
            git -C "$review" add status/disclosure_assembly.json
            if ! git -C "$review" diff --cached --quiet; then
              git -C "$review" config user.name 'github-actions[bot]'
              git -C "$review" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git -C "$review" commit -m "review: deferred source assembly ${{ github.run_id }}"
              git -C "$review" push origin HEAD:refs/heads/review
            fi
            exit 0
          fi
          python -m unison_snapshot verify-first-launch \
            --review-root "$review" --input "$review/candidates/disclosure-current.json" \
            --output "$RUNNER_TEMP/senate-annual-readiness.json"
      - name: Publish verified unified candidate
        if: ${{ steps.assembly.outputs.assembly_status == 'ready' }}
        run: |
          review="$RUNNER_TEMP/senate-annual-review"
          git -C "$review" add candidates/disclosure-current.json status/disclosure_cutoff.json status/disclosure_assembly.json
          if ! git -C "$review" diff --cached --quiet; then
            git -C "$review" config user.name 'github-actions[bot]'
            git -C "$review" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C "$review" commit -m "review: Senate annual holdings ${{ github.run_id }}"
            git -C "$review" push origin HEAD:refs/heads/review
          fi
