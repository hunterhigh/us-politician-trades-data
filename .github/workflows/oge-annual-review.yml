name: OGE annual review extraction

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-annual:
    concurrency:
      group: disclosure-source-writer
      cancel-in-progress: false
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OGE_COLLECTION_ENABLED: ${{ vars.OGE_COLLECTION_ENABLED }}
      OGE_TERMS_ACKNOWLEDGED: ${{ vars.OGE_TERMS_ACKNOWLEDGED }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: code
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check OGE production authorization
        run: |
          test "$OGE_COLLECTION_ENABLED" = true
          test "$OGE_TERMS_ACKNOWLEDGED" = true
          test "$GITHUB_REPOSITORY" = hunterhigh/us-politician-trades-data
      - name: Install annual PDF parser
        run: python -m pip install -e 'backend[house-ingest]'
      - name: Prepare evidence and review branches
        run: |
          git fetch --no-tags origin \
            evidence:refs/remotes/origin/evidence \
            review:refs/remotes/origin/review
          git worktree add --detach "$RUNNER_TEMP/oge-annual-evidence" origin/evidence
          git worktree add --detach "$RUNNER_TEMP/oge-annual-review" origin/review
      - name: Extract content-verified annual reports into review only
        run: |
          PYTHONPATH=backend/src python backend/scripts/oge_annual_review.py \
            --evidence-root "$RUNNER_TEMP/oge-annual-evidence" \
            --review-root "$RUNNER_TEMP/oge-annual-review"
      - name: Publish annual extraction audits
        run: |
          review="$RUNNER_TEMP/oge-annual-review"
          git -C "$review" add oge/annual/extractions oge/annual/extraction-status.json
          if ! git -C "$review" diff --cached --quiet; then
            git -C "$review" config user.name "github-actions[bot]"
            git -C "$review" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$review" commit -m "review: OGE annual extraction ${{ github.run_id }}"
            git -C "$review" push origin HEAD:refs/heads/review
          fi
