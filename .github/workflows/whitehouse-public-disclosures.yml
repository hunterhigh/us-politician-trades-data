name: White House public OGE disclosures

on:
  schedule:
    - cron: '23 8 * * 1,4'
  workflow_dispatch:
    inputs:
      pdf_batch_size:
        description: New public PDFs to attempt this run (1-50)
        required: true
        default: '20'
      extraction_batch_size:
        description: Archived PDFs to extract this run (1-100)
        required: true
        default: '100'
      ocr_page_limit:
        description: Large scanned-PDF pages to OCR this run (25-100)
        required: true
        default: '50'

permissions:
  contents: write

jobs:
  archive-and-review:
    concurrency:
      group: disclosure-source-writer
      cancel-in-progress: false
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OGE_COLLECTION_ENABLED: ${{ vars.OGE_COLLECTION_ENABLED }}
      OGE_TERMS_ACKNOWLEDGED: ${{ vars.OGE_TERMS_ACKNOWLEDGED }}
      PDF_BATCH_SIZE: ${{ inputs.pdf_batch_size || '20' }}
      EXTRACTION_BATCH_SIZE: ${{ inputs.extraction_batch_size || '100' }}
      OCR_PAGE_LIMIT: ${{ inputs.ocr_page_limit || '50' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: code
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Check bounded official-source run
        run: |
          test "$GITHUB_REPOSITORY" = hunterhigh/us-politician-trades-data
          test "$OGE_COLLECTION_ENABLED" = true
          test "$OGE_TERMS_ACKNOWLEDGED" = true
          case "$PDF_BATCH_SIZE" in *[!0-9]*|'') exit 2 ;; esac
          test "$PDF_BATCH_SIZE" -ge 1 && test "$PDF_BATCH_SIZE" -le 50
          case "$EXTRACTION_BATCH_SIZE" in *[!0-9]*|'') exit 2 ;; esac
          test "$EXTRACTION_BATCH_SIZE" -ge 1 && test "$EXTRACTION_BATCH_SIZE" -le 100
          case "$OCR_PAGE_LIMIT" in *[!0-9]*|'') exit 2 ;; esac
          test "$OCR_PAGE_LIMIT" -ge 25 && test "$OCR_PAGE_LIMIT" -le 100
      - name: Install PDF parsers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 tesseract-ocr
          tesseract --version | head -1
          python -m pip install -e 'backend[house-ingest]'
      - name: Prepare evidence and review trees
        run: |
          git fetch --no-tags origin evidence review
          git worktree add --detach "$RUNNER_TEMP/whitehouse-evidence" origin/evidence
          git worktree add --detach "$RUNNER_TEMP/whitehouse-review" origin/review
      - name: Archive public index and bounded original PDFs
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/whitehouse-evidence
          REVIEW_ROOT: ${{ runner.temp }}/whitehouse-review
        run: |
          cursor="$(python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['REVIEW_ROOT']) / 'whitehouse/disclosures/archive-status.json'
          value = json.loads(path.read_text(encoding='utf-8')) if path.is_file() else {}
          print(value.get('last_attempted_id') or '')
          PY
          )"
          python backend/scripts/whitehouse_disclosures.py sync \
            --evidence-root "$EVIDENCE_ROOT" \
            --index-out "$REVIEW_ROOT/whitehouse/disclosures/index-current.json" \
            --iri-audit-out "$REVIEW_ROOT/whitehouse/disclosures/iri-link-audit-current.json" \
            --batch-out "$REVIEW_ROOT/whitehouse/disclosures/batch-current.json" \
            --limit "$PDF_BATCH_SIZE" --start-after-id "$cursor"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['REVIEW_ROOT']) / 'whitehouse/disclosures'
          batch = json.loads((root / 'batch-current.json').read_text(encoding='utf-8'))
          status = {key: batch[key] for key in (
              'schema_version', 'source_id', 'indexed_count', 'attempted_count',
              'last_attempted_id', 'archived_version_count', 'pending_url_count',
              'failures', 'index_quarantine')}
          (root / 'archive-status.json').write_text(
              json.dumps(status, ensure_ascii=False, sort_keys=True, separators=(',', ':')),
              encoding='utf-8')
          PY
      - name: Publish official originals to evidence
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/whitehouse-evidence
        run: |
          git -C "$EVIDENCE_ROOT" add whitehouse/disclosures
          if ! git -C "$EVIDENCE_ROOT" diff --cached --quiet; then
            git -C "$EVIDENCE_ROOT" config user.name "github-actions[bot]"
            git -C "$EVIDENCE_ROOT" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$EVIDENCE_ROOT" commit -m "evidence: White House public disclosures ${{ github.run_id }}"
            git -C "$EVIDENCE_ROOT" push origin HEAD:refs/heads/evidence
          fi
      - name: Build conservative OGE catalog crosswalk
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/whitehouse-evidence
          REVIEW_ROOT: ${{ runner.temp }}/whitehouse-review
        run: |
          manifest="$(python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['EVIDENCE_ROOT']) / 'oge/catalog'
          manifests = []
          for path in root.glob('*.json'):
              value = json.loads(path.read_text(encoding='utf-8'))
              if value.get('schema_version') == 'oge-catalog-archive/v1':
                  manifests.append((value['retrieved_at'], str(path)))
          if not manifests:
              raise SystemExit('No archived OGE catalog manifest for crosswalk')
          print(max(manifests)[1])
          PY
          )"
          python backend/scripts/whitehouse_disclosures.py crosswalk \
            --evidence-root "$EVIDENCE_ROOT" --oge-manifest "$manifest" \
            --index "$REVIEW_ROOT/whitehouse/disclosures/index-current.json" \
            --out "$REVIEW_ROOT/whitehouse/disclosures/crosswalk-current.json"
      - name: Extract hash-verified PDFs into review only
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/whitehouse-evidence
          REVIEW_ROOT: ${{ runner.temp }}/whitehouse-review
        run: |
          cursor="$(python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['REVIEW_ROOT']) / 'whitehouse/extraction-status.json'
          value = json.loads(path.read_text(encoding='utf-8')) if path.is_file() else {}
          print(value.get('last_attempted_id') or '')
          PY
          )"
          python backend/scripts/whitehouse_extract.py \
            --evidence-root "$EVIDENCE_ROOT" --review-root "$REVIEW_ROOT" \
            --limit "$EXTRACTION_BATCH_SIZE" --start-after-id "$cursor" \
            --ocr-page-limit "$OCR_PAGE_LIMIT"
      - name: Account for every public report link
        env:
          REVIEW_ROOT: ${{ runner.temp }}/whitehouse-review
        run: |
          python backend/scripts/whitehouse_coverage.py --review-root "$REVIEW_ROOT"
      - name: Index filer-reported rows independently of frontend eligibility
        env:
          REVIEW_ROOT: ${{ runner.temp }}/whitehouse-review
        run: |
          python backend/scripts/build_whitehouse_reported_index.py --review-root "$REVIEW_ROOT"
      - name: Materialize White House annual filer-reported holdings
        env:
          REVIEW_ROOT: ${{ runner.temp }}/whitehouse-review
        run: |
          python backend/scripts/build_whitehouse_annual_review.py --review-root "$REVIEW_ROOT"
      - name: Publish bounded review audit
        env:
          REVIEW_ROOT: ${{ runner.temp }}/whitehouse-review
        run: |
          git -C "$REVIEW_ROOT" add whitehouse
          if ! git -C "$REVIEW_ROOT" diff --cached --quiet; then
            git -C "$REVIEW_ROOT" config user.name "github-actions[bot]"
            git -C "$REVIEW_ROOT" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$REVIEW_ROOT" commit -m "review: White House public disclosures ${{ github.run_id }}"
            git -C "$REVIEW_ROOT" push origin HEAD:refs/heads/review
          fi
