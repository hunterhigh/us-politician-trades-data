name: Publish bootstrap snapshot (pre-launch only)
on:
  workflow_dispatch:
    inputs:
      normalized_path:
        description: Fixed empty bootstrap input; complete production uses publish-complete.yml
        required: true
        default: ingest/current.json
      allow_empty_production:
        description: Publish an explicit empty production bootstrap while no rows are approved
        required: true
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: publish-snapshot
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/code'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate requested input path
        env:
          INPUT_PATH: ${{ inputs.normalized_path }}
        run: |
          case "$INPUT_PATH" in
            ingest/*.json) ;;
            *) echo "Input must be a JSON file below ingest/" >&2; exit 2 ;;
          esac
          case "$INPUT_PATH" in
            *..*) echo "Input path cannot contain .." >&2; exit 2 ;;
          esac
          test -f "$INPUT_PATH"
      - name: Verify producer and contract
        run: python scripts/verify.py
        working-directory: backend
      - name: Prepare complete snapshot tree
        id: prepare
        env:
          INPUT_PATH: ${{ inputs.normalized_path }}
          ALLOW_EMPTY_PRODUCTION: ${{ inputs.allow_empty_production }}
          DATA_ROOT: ${{ runner.temp }}/production-main
        run: |
          git fetch --no-tags origin main
          base_sha="$(git rev-parse origin/main)"
          test "$INPUT_PATH" = "ingest/current.json" || {
            echo "Legacy publisher only accepts the fixed empty bootstrap input." >&2
            exit 2
          }
          test "$ALLOW_EMPTY_PRODUCTION" = "true" || {
            echo "Legacy publisher only exists for the explicit pre-launch bootstrap." >&2
            exit 2
          }
          current_snapshot="$(git show "$base_sha:manifest.json" | python -c 'import json,sys; print(json.load(sys.stdin).get("snapshot_id", ""))')"
          test "$current_snapshot" = "bootstrap_empty" || {
            echo "A complete snapshot has already launched; refusing to downgrade main." >&2
            exit 2
          }
          git worktree add --detach "$DATA_ROOT" "$base_sha"
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          extra_args=()
          if [ "$ALLOW_EMPTY_PRODUCTION" = "true" ]; then
            extra_args+=(--allow-empty-production)
          fi
          PYTHONPATH=backend/src python -m unison_snapshot prepare-publication \
            --input "$INPUT_PATH" --root "$DATA_ROOT" --generated-at "$generated_at" "${extra_args[@]}"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
      - name: Commit and compare remote head
        id: commit
        env:
          DATA_ROOT: ${{ runner.temp }}/production-main
        run: |
          git -C "$DATA_ROOT" add -A -- manifest.json board
          for path in people tickers; do
            if [ -e "$DATA_ROOT/$path" ]; then
              git -C "$DATA_ROOT" add -A -- "$path"
            fi
          done
          if git -C "$DATA_ROOT" diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No snapshot or health change." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -C "$DATA_ROOT" config user.name "github-actions[bot]"
          git -C "$DATA_ROOT" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          snapshot_id="$(python -c "import json; print(json.load(open('$DATA_ROOT/manifest.json', encoding='utf-8'))['snapshot_id'])")"
          git -C "$DATA_ROOT" commit -m "snapshot ${snapshot_id}"
          new_sha="$(git -C "$DATA_ROOT" rev-parse HEAD)"
          git -C "$DATA_ROOT" tag "published/${new_sha}" "$new_sha"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${{ steps.prepare.outputs.base_sha }}" || {
            echo "Remote main changed during publication; nothing was pushed." >&2
            exit 3
          }
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "new_sha=$new_sha" >> "$GITHUB_OUTPUT"
      - name: Atomically publish branch and authorization tag
        if: steps.commit.outputs.changed == 'true'
        env:
          NEW_SHA: ${{ steps.commit.outputs.new_sha }}
          DATA_ROOT: ${{ runner.temp }}/production-main
        run: git -C "$DATA_ROOT" push --atomic origin HEAD:refs/heads/main "refs/tags/published/${NEW_SHA}"
      - name: Record result
        if: steps.commit.outputs.changed == 'true'
        env:
          NEW_SHA: ${{ steps.commit.outputs.new_sha }}
        run: printf 'Published frozen commit `%s`.\n' "$NEW_SHA" >> "$GITHUB_STEP_SUMMARY"
