name: Publish normalized snapshot
on:
  workflow_dispatch:
    inputs:
      normalized_path:
        description: Repository-relative reviewed input under ingest/
        required: true
        default: ingest/current.json
permissions:
  contents: write
concurrency:
  group: publish-snapshot
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate requested input path
        env:
          INPUT_PATH: ${{ inputs.normalized_path }}
        run: |
          case "$INPUT_PATH" in
            ingest/*.json) ;;
            *) echo "Input must be a JSON file below ingest/" >&2; exit 2 ;;
          esac
          case "$INPUT_PATH" in
            *..*) echo "Input path cannot contain .." >&2; exit 2 ;;
          esac
          test -f "$INPUT_PATH"
      - name: Verify producer and contract
        run: python scripts/verify.py
        working-directory: backend
      - name: Prepare complete snapshot tree
        env:
          INPUT_PATH: ${{ inputs.normalized_path }}
        run: |
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PYTHONPATH=backend/src python -m unison_snapshot prepare-publication \
            --input "$INPUT_PATH" --root . --generated-at "$generated_at"
      - name: Commit and compare remote head
        id: commit
        env:
          BASE_SHA: ${{ github.sha }}
        run: |
          git add -A -- manifest.json board people tickers
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No snapshot or health change." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          snapshot_id="$(python -c "import json; print(json.load(open('manifest.json', encoding='utf-8'))['snapshot_id'])")"
          git commit -m "snapshot ${snapshot_id}"
          new_sha="$(git rev-parse HEAD)"
          git tag "published/${new_sha}" "$new_sha"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA" || {
            echo "Remote main changed during publication; nothing was pushed." >&2
            exit 3
          }
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "new_sha=$new_sha" >> "$GITHUB_OUTPUT"
      - name: Atomically publish branch and authorization tag
        if: steps.commit.outputs.changed == 'true'
        env:
          NEW_SHA: ${{ steps.commit.outputs.new_sha }}
        run: git push --atomic origin HEAD:refs/heads/main "refs/tags/published/${NEW_SHA}"
      - name: Record result
        if: steps.commit.outputs.changed == 'true'
        env:
          NEW_SHA: ${{ steps.commit.outputs.new_sha }}
        run: printf 'Published frozen commit `%s`.\n' "$NEW_SHA" >> "$GITHUB_STEP_SUMMARY"
