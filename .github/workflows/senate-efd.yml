name: Senate eFD PTR catalog
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  evaluate-gate:
    concurrency:
      group: disclosure-source-writer
      cancel-in-progress: false
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      status: ${{ steps.gate.outputs.status }}
    env:
      SENATE_EFD_COLLECTION_ENABLED: ${{ vars.SENATE_EFD_COLLECTION_ENABLED }}
      SENATE_EFD_TERMS_ACKNOWLEDGED: ${{ vars.SENATE_EFD_TERMS_ACKNOWLEDGED }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: code
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Evaluate default-closed source gate
        id: gate
        run: |
          mkdir -p .local
          PYTHONPATH=backend/src python -m unison_snapshot senate-efd-gate \
            --output .local/senate-efd-gate.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          gate = json.loads(Path('.local/senate-efd-gate.json').read_text(encoding='utf-8'))
          print(f"status={gate['status']}")
          PY
      - name: Record authorization gate state
        run: |
          state_root="$RUNNER_TEMP/senate-state"
          git fetch --no-tags origin state
          git worktree add --detach "$state_root" FETCH_HEAD
          STATE_ROOT="$state_root" python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          gate = json.loads(Path('.local/senate-efd-gate.json').read_text(encoding='utf-8'))
          target = Path(os.environ['STATE_ROOT']) / 'status' / 'senate_efd.json'
          prior = json.loads(target.read_text(encoding='utf-8')) if target.is_file() else {}
          value = {
              'schema_version': 'senate-source-run/v1',
              'source_id': 'senate_efd',
              'run_at': datetime.now(timezone.utc).isoformat(),
              'status': gate['status'],
              'collection_enabled': gate['collection_enabled'],
              'terms_acknowledged': gate['terms_acknowledged'],
              'gate': gate,
              'roster': prior.get('roster', {'status': 'unknown'}),
              'detail': (
                  'eFD authorization gate is enabled; catalog collection is pending.'
                  if gate['status'] == 'enabled' else
                  'eFD catalog collection did not run because both explicit production '
                  'authorization variables were not true.'
              ),
          }
          if 'historical_roster' in prior:
              value['historical_roster'] = prior['historical_roster']
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(',', ':')),
                            encoding='utf-8')
          PY
          git -C "$state_root" add status/senate_efd.json
          if ! git -C "$state_root" diff --cached --quiet; then
            git -C "$state_root" config user.name "github-actions[bot]"
            git -C "$state_root" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$state_root" commit -m "state: Senate eFD gate ${{ github.run_id }}"
            git -C "$state_root" push origin HEAD:refs/heads/state
          fi
      - name: Fail a partially enabled gate
        if: ${{ vars.SENATE_EFD_COLLECTION_ENABLED == 'true' && vars.SENATE_EFD_TERMS_ACKNOWLEDGED != 'true' }}
        run: |
          echo "Senate eFD collection was enabled without the required terms acknowledgement." >&2
          exit 2

  collect-catalog:
    needs: evaluate-gate
    if: ${{ needs.evaluate-gate.outputs.status == 'enabled' }}
    concurrency:
      group: disclosure-source-writer
      cancel-in-progress: false
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SENATE_EFD_COLLECTION_ENABLED: ${{ vars.SENATE_EFD_COLLECTION_ENABLED }}
      SENATE_EFD_TERMS_ACKNOWLEDGED: ${{ vars.SENATE_EFD_TERMS_ACKNOWLEDGED }}
      SENATE_EFD_START_DATE: ${{ vars.SENATE_EFD_START_DATE }}
      SENATE_EFD_REPORT_BATCH_SIZE: ${{ vars.SENATE_EFD_REPORT_BATCH_SIZE }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: code
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Prepare production evidence and state branches
        id: trees
        run: |
          evidence_root="$RUNNER_TEMP/senate-evidence"
          state_root="$RUNNER_TEMP/senate-state"
          git fetch --no-tags origin \
            evidence:refs/remotes/origin/evidence \
            state:refs/remotes/origin/state
          git worktree add --detach "$evidence_root" origin/evidence
          git worktree add --detach "$state_root" origin/state
          echo "evidence_root=$evidence_root" >> "$GITHUB_OUTPUT"
          echo "state_root=$state_root" >> "$GITHUB_OUTPUT"
      - name: Verify authorization gate and collect PTR catalog
        env:
          EVIDENCE_ROOT: ${{ steps.trees.outputs.evidence_root }}
          STATE_ROOT: ${{ steps.trees.outputs.state_root }}
        run: |
          mkdir -p .local
          PYTHONPATH=backend/src python -m unison_snapshot senate-efd-gate \
            --output .local/senate-efd-gate.json
          start_date="$SENATE_EFD_START_DATE"
          if [ -z "$start_date" ]; then
            start_date="$(date -u -d '6 years ago' +%F)"
          fi
          PYTHONPATH=backend/src python -m unison_snapshot discover-senate-efd \
            --archive "$EVIDENCE_ROOT" \
            --submitted-start-date "$start_date" \
            --output .local/senate-efd-discovery.json
          roster_sha="$(STATE_ROOT="$STATE_ROOT" python - <<'PY'
          import json, os
          from pathlib import Path
          state = json.loads((Path(os.environ['STATE_ROOT']) / 'status' / 'senate_efd.json').read_text(encoding='utf-8'))
          print(state['roster']['sha256'])
          PY
          )"
          congress_roster_sha="$(STATE_ROOT="$STATE_ROOT" python - <<'PY'
          import json, os
          from pathlib import Path
          state = json.loads((Path(os.environ['STATE_ROOT']) / 'status' / 'senate_efd.json').read_text(encoding='utf-8'))
          history = state.get('historical_roster', {})
          print(history.get('sha256', '') if history.get('status') == 'ok' else '')
          PY
          )"
          identity_args=()
          if [ -n "$congress_roster_sha" ]; then
            congress_roster="$EVIDENCE_ROOT/senate_efd/congress_members/$congress_roster_sha/roster.json"
            test -f "$congress_roster"
            identity_args+=(--congress-roster "$congress_roster")
          fi
          PYTHONPATH=backend/src python -m unison_snapshot match-senate-catalog \
            --discovery .local/senate-efd-discovery.json \
            --roster "$EVIDENCE_ROOT/senate_efd/members/$roster_sha.roster.json" \
            "${identity_args[@]}" \
            --output .local/senate-efd-identities.json
          report_batch_size="$SENATE_EFD_REPORT_BATCH_SIZE"
          if [ -z "$report_batch_size" ]; then
            report_batch_size=2
          fi
          PYTHONPATH=backend/src python -m unison_snapshot archive-senate-report-entrypoints \
            --discovery .local/senate-efd-discovery.json \
            --archive "$EVIDENCE_ROOT" \
            --limit "$report_batch_size" \
            --output .local/senate-efd-report-batch.json
          PYTHONPATH=backend/src python -m unison_snapshot extract-senate-report-entrypoints \
            --batch .local/senate-efd-report-batch.json \
            --archive "$EVIDENCE_ROOT" \
            --output .local/senate-efd-extraction-batch.json
      - name: Publish immutable catalog evidence
        env:
          EVIDENCE_ROOT: ${{ steps.trees.outputs.evidence_root }}
        run: |
          git -C "$EVIDENCE_ROOT" add senate_efd/catalog
          if [ -d "$EVIDENCE_ROOT/senate_efd/reports" ]; then
            git -C "$EVIDENCE_ROOT" add senate_efd/reports
          fi
          if ! git -C "$EVIDENCE_ROOT" diff --cached --quiet; then
            git -C "$EVIDENCE_ROOT" config user.name "github-actions[bot]"
            git -C "$EVIDENCE_ROOT" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$EVIDENCE_ROOT" commit -m "evidence: Senate eFD catalog ${{ github.run_id }}"
            git -C "$EVIDENCE_ROOT" push origin HEAD:refs/heads/evidence
          fi
      - name: Record catalog source state
        env:
          STATE_ROOT: ${{ steps.trees.outputs.state_root }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          gate = json.loads(Path('.local/senate-efd-gate.json').read_text(encoding='utf-8'))
          discovery = json.loads(Path('.local/senate-efd-discovery.json').read_text(encoding='utf-8'))
          report_batch = json.loads(Path('.local/senate-efd-report-batch.json').read_text(encoding='utf-8'))
          extraction_batch = json.loads(Path('.local/senate-efd-extraction-batch.json').read_text(encoding='utf-8'))
          target = Path(os.environ['STATE_ROOT']) / 'status' / 'senate_efd.json'
          prior = json.loads(target.read_text(encoding='utf-8')) if target.is_file() else {}
          value = {
              'schema_version': 'senate-source-run/v1',
              'source_id': 'senate_efd',
              'run_at': datetime.now(timezone.utc).isoformat(),
              'status': 'catalog_ready_for_review',
              'collection_enabled': True,
              'terms_acknowledged': True,
              'gate': gate,
              'roster': prior.get('roster', {'status': 'unknown'}),
              'catalog': {
                  'status': 'ok',
                  'record_count': discovery['records_total'],
                  'page_count': discovery['metadata']['page_count'],
                  'sha256': discovery['metadata']['sha256'],
                  'retrieved_at': discovery['metadata']['retrieved_at'],
              },
              'reports': {
                  'status': ('entrypoints_archived' if report_batch['archived_total'] else
                             'entrypoint_collection_failed' if report_batch['failure_count'] else
                             'not_collected'),
                  'entrypoint_count': report_batch['archived_total'],
                  'pending_count': report_batch['pending_count'],
                  'last_batch_archived': report_batch['archived_count'],
                  'last_batch_failures': report_batch['failure_count'],
                  'evidence_count': extraction_batch['extraction_count'],
                  'last_batch_extractions': extraction_batch['extraction_count'],
                  'last_batch_extraction_failures': extraction_batch['failure_count'],
                  'last_batch_transactions': extraction_batch['transaction_count'],
              },
              'detail': ('Authorized eFD PTR catalog and a bounded batch of report entrypoint '
                         'responses were archived. Transaction facts remain unpublished.'),
          }
          if 'historical_roster' in prior:
              value['historical_roster'] = prior['historical_roster']
          target.parent.mkdir(parents=True, exist_ok=True)
          content = json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(',', ':'))
          target.write_text(content, encoding='utf-8')
          Path('.local/senate-efd-state.json').write_text(content, encoding='utf-8')
          PY
          git -C "$STATE_ROOT" add status/senate_efd.json
          if ! git -C "$STATE_ROOT" diff --cached --quiet; then
            git -C "$STATE_ROOT" config user.name "github-actions[bot]"
            git -C "$STATE_ROOT" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$STATE_ROOT" commit -m "state: Senate eFD catalog ${{ github.run_id }}"
            git -C "$STATE_ROOT" push origin HEAD:refs/heads/state
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: senate-efd-discovery-${{ github.run_id }}
          path: |
            .local/senate-efd-discovery.json
            .local/senate-efd-identities.json
            .local/senate-efd-report-batch.json
            .local/senate-efd-extraction-batch.json
            .local/senate-efd-state.json
          include-hidden-files: true
          retention-days: 1

  publish-review-catalog:
    needs: collect-catalog
    concurrency:
      group: disclosure-review-writer
      cancel-in-progress: false
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: code
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: senate-efd-discovery-${{ github.run_id }}
          path: .local
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Publish normalized catalog to review branch
        run: |
          review_root="$RUNNER_TEMP/senate-review"
          git fetch --no-tags origin review
          git worktree add --detach "$review_root" FETCH_HEAD
          REVIEW_ROOT="$review_root" python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          source = Path('.local/senate-efd-discovery.json')
          discovery = json.loads(source.read_text(encoding='utf-8'))
          identities = json.loads(Path('.local/senate-efd-identities.json').read_text(encoding='utf-8'))
          report_batch = json.loads(Path('.local/senate-efd-report-batch.json').read_text(encoding='utf-8'))
          extraction_batch = json.loads(Path('.local/senate-efd-extraction-batch.json').read_text(encoding='utf-8'))
          review = Path(os.environ['REVIEW_ROOT'])
          sha = discovery['metadata']['sha256']
          if (identities.get('schema_version') != 'senate-efd-identities/v1' or
                  identities.get('source_id') != 'senate_efd' or
                  identities.get('catalog_sha256') != sha or
                  identities.get('report_count') != discovery['records_total'] or
                  sum(identities.get('identity_counts', {}).values()) != discovery['records_total'] or
                  {item.get('document_id') for item in identities.get('identities', [])} !=
                  {item.get('document_id') for item in discovery['reports']}):
              raise SystemExit('Senate eFD identity batch does not match its discovery catalog')
          roster_sha = identities.get('roster_sha256')
          if not isinstance(roster_sha, str) or len(roster_sha) != 64:
              raise SystemExit('Senate eFD identity batch has no valid roster hash')
          congress_roster_sha = identities.get('congress_roster_sha256')
          if congress_roster_sha is not None and (
                  not isinstance(congress_roster_sha, str) or len(congress_roster_sha) != 64):
              raise SystemExit('Senate eFD identity batch has no valid Congress.gov roster hash')
          target = review / 'senate_efd' / 'discoveries' / f'{sha}.json'
          target.parent.mkdir(parents=True, exist_ok=True)
          content = json.dumps(discovery, ensure_ascii=False, sort_keys=True, separators=(',', ':'))
          if target.is_file() and target.read_text(encoding='utf-8') != content:
              raise SystemExit('Senate eFD discovery conflicts with its content hash')
          target.write_text(content, encoding='utf-8')
          identity_binding = hashlib.sha256(
              f"{roster_sha}:{congress_roster_sha or ''}".encode('ascii')).hexdigest()
          identity_target = review / 'senate_efd' / 'identities' / sha / f'{identity_binding}.json'
          identity_target.parent.mkdir(parents=True, exist_ok=True)
          identity_content = json.dumps(
              identities, ensure_ascii=False, sort_keys=True, separators=(',', ':'))
          if identity_target.is_file() and identity_target.read_text(encoding='utf-8') != identity_content:
              raise SystemExit('Senate eFD identities conflict with their catalog hash')
          identity_target.write_text(identity_content, encoding='utf-8')
          for collection, folder in (
                  (extraction_batch['extractions'], 'extractions'),
                  (extraction_batch['inspections'], 'paper_inspections')):
              for item in collection:
                  item_target = (review / 'senate_efd' / folder / item['document_id'] /
                                 item['source_sha256'] / f"{item['parser_version']}.json")
                  item_target.parent.mkdir(parents=True, exist_ok=True)
                  item_content = json.dumps(
                      item, ensure_ascii=False, sort_keys=True, separators=(',', ':'))
                  if item_target.is_file() and item_target.read_text(encoding='utf-8') != item_content:
                      raise SystemExit('Senate eFD report result conflicts with its source hash')
                  item_target.write_text(item_content, encoding='utf-8')
          for item in extraction_batch['failures']:
              item_target = (review / 'senate_efd' / 'report_failures' / item['document_id'] /
                             item['source_sha256'] / f"{item['parser_version']}.json")
              item_target.parent.mkdir(parents=True, exist_ok=True)
              item_content = json.dumps(
                  item, ensure_ascii=False, sort_keys=True, separators=(',', ':'))
              if item_target.is_file() and item_target.read_text(encoding='utf-8') != item_content:
                  raise SystemExit('Senate eFD report failure conflicts with its source hash')
              item_target.write_text(item_content, encoding='utf-8')
          parser_version = extraction_batch['parser_version']
          extraction_paths = list(review.glob(
              f'senate_efd/extractions/*/*/{parser_version}.json'))
          extraction_values = [json.loads(path.read_text(encoding='utf-8'))
                               for path in extraction_paths]
          evidence_count = sum(bool(item.get('evidence_complete')) for item in extraction_values)
          transaction_count = sum(len(item.get('transactions', [])) for item in extraction_values)
          report_failure_count = sum(len(list(review.glob(pattern))) for pattern in (
              f'senate_efd/report_failures/*/*/{parser_version}.json',
              f'senate_efd/paper_report_failures/*/*/{parser_version}.json',
          ))
          status = {
              'schema_version': 'senate-review-run/v1',
              'source_id': 'senate_efd',
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'status': 'catalog_ready_for_review',
              'catalog_sha256': sha,
              'catalog_record_count': discovery['records_total'],
              'identity_counts': identities['identity_counts'],
              'identity_roster_sha256': roster_sha,
              'identity_binding_sha256': identity_binding,
              'report_parser_version': parser_version,
              'report_entrypoint_count': report_batch['archived_total'],
              'report_entrypoint_pending_count': report_batch['pending_count'],
              'report_entrypoint_failure_count': report_batch['failure_count'],
              'report_evidence_count': evidence_count,
              'report_extraction_failure_count': report_failure_count,
              'extracted_transaction_count': transaction_count,
              'detail': (f"{report_batch['archived_total']} PTR entrypoints archived; "
                         f"{evidence_count} electronic reports parsed into {transaction_count} transactions; "
                         f"{report_failure_count} current-parser failures remain."),
          }
          if congress_roster_sha:
              status['identity_congress_roster_sha256'] = congress_roster_sha
          status_path = review / 'status' / 'senate_efd.json'
          status_path.parent.mkdir(parents=True, exist_ok=True)
          status_path.write_text(json.dumps(status, ensure_ascii=False, sort_keys=True, separators=(',', ':')),
                                 encoding='utf-8')
          PY
      - name: Build and validate frontend candidate
        env:
          REVIEW_ROOT: ${{ runner.temp }}/senate-review
        run: |
          status="$REVIEW_ROOT/status/senate_efd.json"
          catalog_sha="$(python -c "import json; print(json.load(open('$status'))['catalog_sha256'])")"
          roster_sha="$(python -c "import json; print(json.load(open('$status'))['identity_roster_sha256'])")"
          congress_roster_sha="$(python -c "import json; print(json.load(open('$status')).get('identity_congress_roster_sha256', ''))")"
          identity_binding="$(python -c "import json; print(json.load(open('$status'))['identity_binding_sha256'])")"
          parser_version="$(python -c "import json; print(json.load(open('$status'))['report_parser_version'])")"
          audit_temp="$RUNNER_TEMP/senate-efd-qualification.json"
          mkdir -p "$REVIEW_ROOT/candidates/sources"
          PYTHONPATH=backend/src python -m unison_snapshot build-senate-candidate \
            --review-root "$REVIEW_ROOT" \
            --state-status .local/senate-efd-state.json \
            --base ingest/current.json \
            --output "$REVIEW_ROOT/candidates/sources/senate_efd-current.json" \
            --audit-output "$audit_temp" \
            --html-output "$RUNNER_TEMP/senate-efd-current.html"
          builder_version="$(python -c "import json; print(json.load(open('$audit_temp'))['builder_version'])")"
          candidate_snapshot="$(python -c "import json; print(json.load(open('$audit_temp'))['candidate_snapshot_id'])")"
          audit="$REVIEW_ROOT/senate_efd/qualifications/$catalog_sha/$identity_binding/$parser_version/$builder_version/$candidate_snapshot.json"
          mkdir -p "$(dirname "$audit")"
          if [ -e "$audit" ] && ! cmp -s "$audit_temp" "$audit"; then
            echo "Immutable Senate qualification audit collision: $audit" >&2
            exit 1
          fi
          cp "$audit_temp" "$audit"
          cp "$audit_temp" "$REVIEW_ROOT/senate_efd/qualifications/current.json"
          source_args=(--source "senate_efd=$REVIEW_ROOT/candidates/sources/senate_efd-current.json")
          if [ -f "$REVIEW_ROOT/candidates/sources/house_clerk-current.json" ]; then
            source_args+=(--source "house_clerk=$REVIEW_ROOT/candidates/sources/house_clerk-current.json")
          fi
          if [ -f "$REVIEW_ROOT/candidates/sources/oge-current.json" ]; then
            source_args+=(--source "oge=$REVIEW_ROOT/candidates/sources/oge-current.json")
          fi
          PYTHONPATH=backend/src python -m unison_snapshot build-disclosure-candidate \
            --base ingest/current.json \
            --harmonize-cutoffs \
            "${source_args[@]}" \
            --output "$REVIEW_ROOT/candidates/disclosure-current.json" \
            --audit-output "$REVIEW_ROOT/status/disclosure_cutoff.json" \
            --html-output "$RUNNER_TEMP/disclosure-current.html"
          CANDIDATE="$REVIEW_ROOT/candidates/disclosure-current.json" \
            BUILDER_COMMIT="${{ github.sha }}" python - <<'PY'
          import json, os
          from pathlib import Path
          candidate = json.loads(Path(os.environ['CANDIDATE']).read_text(encoding='utf-8'))
          disclosure_sources = {'house_clerk', 'senate_efd', 'oge'}
          included = sorted(row['source_id'] for row in candidate['source_health']
                            if row.get('source_id') in disclosure_sources
                            and row.get('status') in {'ok', 'partial'})
          value = {
              'schema_version': 'disclosure-candidate-run/v1',
              'builder_commit': os.environ['BUILDER_COMMIT'],
              'data_cutoff_at': candidate['meta']['data_cutoff_at'],
              'included_sources': included,
              'pending_sources': sorted(disclosure_sources - set(included)),
              'people_count': len(candidate['people']),
              'transaction_count': len(candidate['transactions']),
              'reported_holding_count': len(candidate['reported_holdings']),
              'status': 'partial',
              'cutoff_audit': 'status/disclosure_cutoff.json',
          }
          target = Path(os.environ['REVIEW_ROOT']) / 'status' / 'disclosure_candidate.json'
          target.write_text(json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(',', ':')),
                            encoding='utf-8')
          PY
          git -C "$REVIEW_ROOT" add candidates senate_efd status/senate_efd.json \
            status/disclosure_candidate.json status/disclosure_cutoff.json
          if ! git -C "$REVIEW_ROOT" diff --cached --quiet; then
            git -C "$REVIEW_ROOT" config user.name "github-actions[bot]"
            git -C "$REVIEW_ROOT" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$REVIEW_ROOT" commit -m "review: Senate eFD catalog ${{ github.run_id }}"
            git -C "$REVIEW_ROOT" push origin HEAD:refs/heads/review
          fi
