name: Publish complete production snapshot

on:
  schedule:
    - cron: '30 22 * * 1-5'
  workflow_dispatch:
    inputs:
      batch_size:
        description: Alpaca symbols per request
        required: true
        default: '100'

permissions:
  contents: write

concurrency:
  group: publish-snapshot
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/code'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Enforce scheduled publication switch
        if: github.event_name == 'schedule'
        env:
          ENABLED: ${{ vars.COMPLETE_PUBLICATION_ENABLED }}
        run: test "$ENABLED" = "true"
      - uses: actions/checkout@v7
        with:
          ref: code
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend-e2e/package-lock.json
      - name: Install producer
        run: python -m pip install -e backend
      - name: Enforce licensed production gate
        env:
          AUTHORIZED: ${{ vars.MARKET_DISTRIBUTION_AUTHORIZED }}
          KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          BATCH_SIZE: ${{ inputs.batch_size || vars.MARKET_BATCH_SIZE || '100' }}
        run: |
          test "$AUTHORIZED" = "true" || {
            echo "MARKET_DISTRIBUTION_AUTHORIZED must be true in production." >&2
            exit 2
          }
          test -n "$KEY_ID" && test -n "$SECRET_KEY" || {
            echo "Alpaca production credentials are not configured." >&2
            exit 2
          }
          case "$BATCH_SIZE" in *[!0-9]*) exit 2 ;; esac
          test "$BATCH_SIZE" -ge 1 && test "$BATCH_SIZE" -le 200
      - name: Prepare fixed source and publication trees
        id: trees
        run: |
          git fetch --no-tags origin review main market
          review_root="$RUNNER_TEMP/complete-review"
          market_root="$RUNNER_TEMP/complete-market"
          main_root="$RUNNER_TEMP/complete-main"
          git worktree add --detach "$review_root" origin/review
          git worktree add --detach "$market_root" origin/market
          git worktree add --detach "$main_root" origin/main
          echo "review_root=$review_root" >> "$GITHUB_OUTPUT"
          echo "market_root=$market_root" >> "$GITHUB_OUTPUT"
          echo "main_root=$main_root" >> "$GITHUB_OUTPUT"
          echo "market_base=$(git -C "$market_root" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "main_base=$(git -C "$main_root" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify first-launch disclosure completeness
        env:
          REVIEW_ROOT: ${{ steps.trees.outputs.review_root }}
          PYTHONPATH: backend/src
        run: |
          python -m unison_snapshot verify-first-launch \
            --review-root "$REVIEW_ROOT" \
            --input "$REVIEW_ROOT/candidates/disclosure-current.json" \
            --output "$RUNNER_TEMP/release-readiness.json"
      - name: Build licensed five-array candidate
        env:
          REVIEW_ROOT: ${{ steps.trees.outputs.review_root }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_ASSETS_URL: ${{ vars.ALPACA_ASSETS_URL }}
          BATCH_SIZE: ${{ inputs.batch_size || vars.MARKET_BATCH_SIZE || '100' }}
          PYTHONPATH: backend/src
        run: |
          checked_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          assets_url="${ALPACA_ASSETS_URL:-https://paper-api.alpaca.markets/v2/assets}"
          python -m unison_snapshot build-alpaca-market-validation \
            --input "$REVIEW_ROOT/candidates/disclosure-current.json" \
            --output "$RUNNER_TEMP/complete-candidate.json" \
            --audit-output "$RUNNER_TEMP/market-audit.json" \
            --processed-output "$RUNNER_TEMP/complete-processed.json" \
            --html-output "$RUNNER_TEMP/complete-dashboard.html" \
            --checked-at "$checked_at" --batch-size "$BATCH_SIZE" \
            --assets-url "$assets_url" \
            --distribution-authorized
      - name: Select fixed published readback probes
        id: probes
        run: |
          python - <<'PY'
          import json, os
          candidate = json.load(open(os.environ['RUNNER_TEMP'] + '/complete-candidate.json'))
          covered = {row['ticker'] for row in candidate['security_market_data']}
          transaction = next(
              row for row in candidate['transactions']
              if row.get('ticker') in covered)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"person_id={transaction['person_id']}\n")
              output.write(f"ticker={transaction['ticker']}\n")
          PY
      - name: Verify complete candidate in the frozen browser frontend
        env:
          PRODUCTION_DASHBOARD_HTML: ${{ runner.temp }}/complete-dashboard.html
        run: |
          npm ci
          npm run test:production
        working-directory: frontend-e2e
      - name: Prepare and commit market branch
        id: market
        env:
          MARKET_ROOT: ${{ steps.trees.outputs.market_root }}
          PYTHONPATH: backend/src
        run: |
          python -m unison_snapshot prepare-market-publication \
            --input "$RUNNER_TEMP/complete-candidate.json" --root "$MARKET_ROOT" \
            --metadata-output "$RUNNER_TEMP/market-publication.json"
          git -C "$MARKET_ROOT" add -A -- market market-pages
          if ! git -C "$MARKET_ROOT" diff --cached --quiet; then
            git -C "$MARKET_ROOT" config user.name "github-actions[bot]"
            git -C "$MARKET_ROOT" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$MARKET_ROOT" commit -m "market: licensed Alpaca EOD ${{ github.run_id }}"
          fi
          market_sha="$(git -C "$MARKET_ROOT" rev-parse HEAD)"
          echo "market_sha=$market_sha" >> "$GITHUB_OUTPUT"
      - name: Publish market before disclosure pointer
        env:
          MARKET_ROOT: ${{ steps.trees.outputs.market_root }}
          MARKET_SHA: ${{ steps.market.outputs.market_sha }}
          MARKET_BASE: ${{ steps.trees.outputs.market_base }}
        run: |
          if ! git ls-remote --exit-code origin "refs/tags/published-market/$MARKET_SHA" >/dev/null 2>&1; then
            remote_market="$(git ls-remote origin refs/heads/market | cut -f1)"
            test "$remote_market" = "$MARKET_BASE" || {
              echo "market moved after the candidate was built; refusing stale publication" >&2
              exit 1
            }
            git -C "$MARKET_ROOT" tag "published-market/$MARKET_SHA" "$MARKET_SHA"
            git -C "$MARKET_ROOT" push --atomic origin \
              HEAD:refs/heads/market "refs/tags/published-market/$MARKET_SHA"
          fi
      - name: Prepare complete main snapshot
        id: main
        env:
          MAIN_ROOT: ${{ steps.trees.outputs.main_root }}
          MARKET_SHA: ${{ steps.market.outputs.market_sha }}
          PYTHONPATH: backend/src
        run: |
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python -m unison_snapshot prepare-publication \
            --input "$RUNNER_TEMP/complete-candidate.json" --root "$MAIN_ROOT" \
            --generated-at "$generated_at" --allow-market --market-commit "$MARKET_SHA" \
            --market-pages-file "$RUNNER_TEMP/market-publication.json"
          git -C "$MAIN_ROOT" add -A -- manifest.json board people tickers
          if git -C "$MAIN_ROOT" diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -C "$MAIN_ROOT" config user.name "github-actions[bot]"
          git -C "$MAIN_ROOT" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          snapshot_id="$(python -c "import json; print(json.load(open('$MAIN_ROOT/manifest.json'))['snapshot_id'])")"
          git -C "$MAIN_ROOT" commit -m "snapshot $snapshot_id"
          main_sha="$(git -C "$MAIN_ROOT" rev-parse HEAD)"
          git -C "$MAIN_ROOT" tag "published/$main_sha" "$main_sha"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
      - name: Atomically publish complete main snapshot
        if: steps.main.outputs.changed == 'true'
        env:
          MAIN_ROOT: ${{ steps.trees.outputs.main_root }}
          MAIN_SHA: ${{ steps.main.outputs.main_sha }}
          MAIN_BASE: ${{ steps.trees.outputs.main_base }}
        run: |
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_main" = "$MAIN_BASE" || {
            echo "main moved after the candidate was built; refusing stale publication" >&2
            exit 1
          }
          git -C "$MAIN_ROOT" push --atomic origin \
            HEAD:refs/heads/main "refs/tags/published/$MAIN_SHA"
      - name: Read back the published main and market commits
        env:
          EXPECTED_MAIN: ${{ steps.main.outputs.main_sha || steps.trees.outputs.main_base }}
          PERSON_ID: ${{ steps.probes.outputs.person_id }}
          TICKER: ${{ steps.probes.outputs.ticker }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: backend/src
        run: |
          fetch_selection() {
            mode="$1"
            key="$2"
            output="$3"
            for attempt in 1 2 3 4; do
              args=(--owner hunterhigh --repo us-politician-trades-data --ref main \
                    --mode "$mode" --output "$output")
              if [ -n "$key" ]; then args+=(--key "$key"); fi
              if python -m unison_snapshot fetch-public "${args[@]}"; then return 0; fi
              sleep $((attempt * 2))
            done
            return 1
          }
          fetch_selection dashboard '' "$RUNNER_TEMP/readback-dashboard.json"
          fetch_selection search '' "$RUNNER_TEMP/readback-search.json"
          fetch_selection person "$PERSON_ID" "$RUNNER_TEMP/readback-person.json"
          fetch_selection ticker "$TICKER" "$RUNNER_TEMP/readback-ticker.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          from unison_snapshot.legacy import load

          root = Path(os.environ['RUNNER_TEMP'])
          expected = os.environ['EXPECTED_MAIN']
          person_id = os.environ['PERSON_ID']
          ticker = os.environ['TICKER']
          values = {
              mode: json.loads((root / f'readback-{mode}.json').read_text(encoding='utf-8'))
              for mode in ('dashboard', 'search', 'person', 'ticker')
          }
          for mode, value in values.items():
              if value['meta']['snapshot_commit'] != expected:
                  raise SystemExit(f'{mode} resolved an unexpected main commit')
              if value['meta']['selection_scope']['mode'] != mode:
                  raise SystemExit(f'{mode} returned an unexpected selection scope')
          for mode in ('dashboard', 'search'):
              for key in ('people', 'transactions', 'reported_holdings',
                          'security_market_data', 'source_health'):
                  if not values[mode].get(key):
                      raise SystemExit(f'{mode} returned an empty {key} array')
          if values['person']['meta']['selection_scope']['key'] != person_id \
                  or not values['person']['transactions']:
              raise SystemExit('Published person readback is incomplete')
          if values['ticker']['meta']['selection_scope']['key'] != ticker \
                  or not values['ticker']['transactions'] \
                  or not values['ticker']['security_market_data']:
              raise SystemExit('Published ticker readback is incomplete')

          renderer = load('render_dashboard')
          html = renderer.render_html(renderer.load_dashboard_data(
              root / 'readback-dashboard.json'))
          (root / 'readback-dashboard.html').write_text(html, encoding='utf-8')
          PY
      - name: Verify the published result in the frozen browser frontend
        env:
          PRODUCTION_DASHBOARD_HTML: ${{ runner.temp }}/readback-dashboard.html
        run: npm run test:production
        working-directory: frontend-e2e
      - name: Record auditable coverage
        env:
          MARKET_SHA: ${{ steps.market.outputs.market_sha }}
          MAIN_SHA: ${{ steps.main.outputs.main_sha }}
        run: |
          python - <<'PY'
          import json, os
          audit=json.load(open(os.environ['RUNNER_TEMP']+'/market-audit.json'))
          readiness=json.load(open(os.environ['RUNNER_TEMP']+'/release-readiness.json'))
          print(f"Market commit: `{os.environ['MARKET_SHA']}`")
          print(f"Main commit: `{os.environ.get('MAIN_SHA') or 'unchanged'}`")
          print(f"Disclosures: {readiness['people_count']} people, {readiness['transaction_count']} transactions, {readiness['reported_holding_count']} holdings")
          print(f"Market coverage: {audit['market_row_count']}/{audit['symbol_count']} tickers")
          print(f"Historical symbols recovered: {audit['historical_recovered_count']}")
          print(f"Historical symbols rejected by API: {len(audit['historical_rejected_symbols'])}")
          print(f"Price points: {audit['price_point_count']}")
          print(f"Missing tickers: {audit['missing_ticker_count']}")
          print(f"Outside SIP scope: {audit['unsupported_ticker_count']}")
          print(f"Unresolved tickers: {audit['unresolved_ticker_count']}")
          print(f"Recovered explicit tickers: {audit['recovered_ticker_count']}")
          PY
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          audit=json.load(open(os.environ['RUNNER_TEMP']+'/market-audit.json'))
          readiness=json.load(open(os.environ['RUNNER_TEMP']+'/release-readiness.json'))
          print(f"Market commit: `{os.environ['MARKET_SHA']}`")
          print(f"Main commit: `{os.environ.get('MAIN_SHA') or 'unchanged'}`")
          print(f"Disclosures: {readiness['people_count']} people, {readiness['transaction_count']} transactions, {readiness['reported_holding_count']} holdings")
          print(f"Market coverage: {audit['market_row_count']}/{audit['symbol_count']} tickers")
          print(f"Historical symbols recovered: {audit['historical_recovered_count']}")
          print(f"Historical symbols rejected by API: {len(audit['historical_rejected_symbols'])}")
          print(f"Price points: {audit['price_point_count']}")
          print(f"Missing tickers: {audit['missing_ticker_count']}")
          print(f"Outside SIP scope: {audit['unsupported_ticker_count']}")
          print(f"Unresolved tickers: {audit['unresolved_ticker_count']}")
          print(f"Recovered explicit tickers: {audit['recovered_ticker_count']}")
          PY
