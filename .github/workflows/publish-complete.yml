name: Publish complete production snapshot

on:
  schedule:
    # Price preparation and disclosure publication run independently.
    - cron: '30 22 * * 1-5'
    - cron: '31 22 * * 1-5'
  workflow_dispatch:
    inputs:
      refresh_market:
        description: Prepare new prices outside the publication lock, then join the latest disclosures
        type: boolean
        default: false
      batch_size:
        description: Alpaca symbols per request
        required: true
        default: '100'
      twelve_data_limit:
        description: Twelve Data symbols to advance; 0 reuses the published cache without requests
        required: true
        default: '100'
      skip_prepared_readback:
        description: Skip remote prepared-commit readback; browser checks use the local candidate
        required: false
        type: boolean
        default: false
      recovery_stop_before_publish:
        description: Exercise a late failure after all checks without moving production refs
        required: false
        type: boolean
        default: false
      require_trump_sept_oge:
        description: Require the September Trump 278-T rows and market-backed ticker in the frozen frontend
        required: false
        type: boolean
        default: false
      cache_main_ref:
        description: Optional published main commit used only for cache recovery
        required: false
        default: ''
      cache_market_ref:
        description: Matching published market commit used only for cache recovery
        required: false
        default: ''

permissions:
  contents: write

jobs:
  refresh:
    if: github.ref == 'refs/heads/code' && (inputs.refresh_market || github.event.schedule == '30 22 * * 1-5')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: prepare-market-refresh
      cancel-in-progress: false
    steps:
      - name: Enforce scheduled publication switch
        if: github.event_name == 'schedule'
        env:
          ENABLED: ${{ vars.COMPLETE_PUBLICATION_ENABLED }}
        run: test "$ENABLED" = "true"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install producer
        run: python -m pip install -e backend
      - name: Enforce licensed production gate
        env:
          AUTHORIZED: ${{ vars.MARKET_DISTRIBUTION_AUTHORIZED }}
          KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          TWELVE_AUTHORIZED: ${{ vars.TWELVE_DATA_DISTRIBUTION_AUTHORIZED }}
          TWELVE_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          BATCH_SIZE: ${{ inputs.batch_size || vars.MARKET_BATCH_SIZE || '100' }}
          TWELVE_LIMIT: ${{ inputs.twelve_data_limit || '100' }}
          CACHE_MAIN_REF: ${{ inputs.cache_main_ref }}
          CACHE_MARKET_REF: ${{ inputs.cache_market_ref }}
        run: |
          test "$AUTHORIZED" = "true" || {
            echo "MARKET_DISTRIBUTION_AUTHORIZED must be true in production." >&2
            exit 2
          }
          test -n "$KEY_ID" && test -n "$SECRET_KEY" || {
            echo "Alpaca production credentials are not configured." >&2
            exit 2
          }
          test "$TWELVE_AUTHORIZED" = "true" || {
            echo "Twelve Data distribution authorization is missing." >&2
            exit 2
          }
          case "$BATCH_SIZE" in *[!0-9]*) exit 2 ;; esac
          test "$BATCH_SIZE" -ge 1 && test "$BATCH_SIZE" -le 200
          case "$TWELVE_LIMIT" in *[!0-9]*) exit 2 ;; esac
          test "$TWELVE_LIMIT" -ge 0 && test "$TWELVE_LIMIT" -le 100
          if [ "$TWELVE_LIMIT" -gt 0 ] && [ -z "$TWELVE_KEY" ]; then
            echo "Twelve Data credential is required when advancing its cache." >&2
            exit 2
          fi
          if { [ -z "$CACHE_MAIN_REF" ] && [ -n "$CACHE_MARKET_REF" ]; } \
              || { [ -n "$CACHE_MAIN_REF" ] && [ -z "$CACHE_MARKET_REF" ]; }; then
            echo "Cache recovery requires both main and market commits." >&2
            exit 2
          fi
          if [ -n "$CACHE_MAIN_REF" ]; then
            [[ "$CACHE_MAIN_REF" =~ ^[0-9a-f]{40}$ ]]
            [[ "$CACHE_MARKET_REF" =~ ^[0-9a-f]{40}$ ]]
          fi
      - name: Prepare fixed source and publication trees
        id: trees
        env:
          CACHE_MAIN_OVERRIDE: ${{ inputs.cache_main_ref }}
          CACHE_MARKET_OVERRIDE: ${{ inputs.cache_market_ref }}
        run: bash .github/scripts/prepare-publication-trees.sh
      - name: Build canonical disclosure projection from qualified sources
        env:
          REVIEW_ROOT: ${{ steps.trees.outputs.review_root }}
          PYTHONPATH: backend/src
        run: |
          python -m unison_snapshot build-disclosure-candidate \
            --base ingest/current.json --harmonize-cutoffs \
            --source "house_clerk=$REVIEW_ROOT/candidates/sources/house_clerk-current.json" \
            --source "oge=$REVIEW_ROOT/candidates/sources/oge-current.json" \
            --source "senate_efd=$REVIEW_ROOT/candidates/sources/senate_efd-current.json" \
            --output "$RUNNER_TEMP/governed-disclosure.json" \
            --audit-output "$RUNNER_TEMP/governed-cutoff.json"
      - name: Build licensed five-array candidate
        env:
          REVIEW_ROOT: ${{ steps.trees.outputs.review_root }}
          CACHE_MAIN_ROOT: ${{ steps.trees.outputs.cache_main_root }}
          CACHE_MARKET_ROOT: ${{ steps.trees.outputs.cache_market_root }}
          CACHE_MARKET_COMMIT: ${{ steps.trees.outputs.cache_market_commit }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_ASSETS_URL: ${{ vars.ALPACA_ASSETS_URL }}
          BATCH_SIZE: ${{ inputs.batch_size || vars.MARKET_BATCH_SIZE || '100' }}
          PYTHONPATH: backend/src
        run: |
          checked_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          assets_url="${ALPACA_ASSETS_URL:-https://paper-api.alpaca.markets/v2/assets}"
          python -m unison_snapshot build-alpaca-market-validation \
            --input "$RUNNER_TEMP/governed-disclosure.json" \
            --output "$RUNNER_TEMP/complete-candidate.json" \
            --audit-output "$RUNNER_TEMP/market-audit.json" \
            --checked-at "$checked_at" --batch-size "$BATCH_SIZE" \
            --assets-url "$assets_url" \
            --previous-main-root "$CACHE_MAIN_ROOT" \
            --previous-market-root "$CACHE_MARKET_ROOT" \
            --previous-market-commit "$CACHE_MARKET_COMMIT" \
            --distribution-authorized
      - name: Reuse or advance licensed Twelve Data daily prices
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TWELVE_LIMIT: ${{ inputs.twelve_data_limit || '100' }}
          PYTHONPATH: backend/src
        run: |
          checked_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python -m unison_snapshot build-twelve-data-supplement \
            --input "$RUNNER_TEMP/complete-candidate.json" \
            --output "$RUNNER_TEMP/complete-candidate.json" \
            --audit-output "$RUNNER_TEMP/twelve-audit.json" \
            --checked-at "$checked_at" --limit "$TWELVE_LIMIT" \
            --previous-main-root "${{ steps.trees.outputs.cache_main_root }}" \
            --previous-market-root "${{ steps.trees.outputs.cache_market_root }}" \
            --previous-market-commit "${{ steps.trees.outputs.cache_market_commit }}" \
            --distribution-authorized
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          audit = json.loads((root / 'twelve-audit.json').read_text(encoding='utf-8'))
          print('Twelve Data transport:', json.dumps(audit['transport'], sort_keys=True))
          print('Twelve Data history:', json.dumps(audit['history_counts'], sort_keys=True))
          print(f"Twelve Data scheduling: new {audit['new_selected_count']}/{audit['new_due_count']}; refresh {audit['refresh_selected_count']}/{audit['refresh_due_count']}; deferred new {audit['new_deferred_count']}, refresh {audit['refresh_deferred_count']}")
          if audit['accepted_count'] < 1:
              raise SystemExit('No qualified Twelve Data price series; preserving the last publication')
          PY
      - name: Save price-only handoff
        env:
          MARKET_BASE: ${{ steps.trees.outputs.market_base }}
        run: |
          python - <<'PY'
          import gzip, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          value = json.loads((root / 'complete-candidate.json').read_text())
          prices = {key: value[key] for key in ('meta', 'security_market_data', 'source_health')}
          (root / 'prices.json.gz').write_bytes(gzip.compress(json.dumps(prices, separators=(',', ':')).encode(), compresslevel=1))
          (root / 'market-base.txt').write_text(os.environ['MARKET_BASE'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-prices-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/prices.json.gz
            ${{ runner.temp }}/market-base.txt
            ${{ runner.temp }}/market-audit.json
            ${{ runner.temp }}/twelve-audit.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
  publish:
    needs: refresh
    if: always() && github.ref == 'refs/heads/code' && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    concurrency:
      group: publish-snapshot
      queue: max
      cancel-in-progress: false
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Enforce scheduled publication switch
        if: github.event_name == 'schedule'
        env:
          ENABLED: ${{ vars.COMPLETE_PUBLICATION_ENABLED }}
        run: test "$ENABLED" = "true"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend-e2e/package-lock.json
      - name: Install producer and native source proofs
        run: python -m pip install -e 'backend[native-source-proof]'
      - name: Enforce licensed cache publication
        env:
          AUTHORIZED: ${{ vars.MARKET_DISTRIBUTION_AUTHORIZED }}
          TWELVE_AUTHORIZED: ${{ vars.TWELVE_DATA_DISTRIBUTION_AUTHORIZED }}
          CACHE_MAIN_REF: ${{ inputs.cache_main_ref }}
          CACHE_MARKET_REF: ${{ inputs.cache_market_ref }}
          REFRESHED: ${{ needs.refresh.result }}
        run: |
          test "$AUTHORIZED" = true && test "$TWELVE_AUTHORIZED" = true
          if [ "$REFRESHED" != success ]; then
            test -z "$CACHE_MAIN_REF" && test -z "$CACHE_MARKET_REF" || {
              echo 'Cache recovery overrides require refresh_market=true.' >&2
              exit 2
            }
          fi
      - name: Prepare fixed source and publication trees
        id: trees
        env:
          CACHE_MAIN_OVERRIDE: ${{ inputs.cache_main_ref }}
          CACHE_MARKET_OVERRIDE: ${{ inputs.cache_market_ref }}
        run: bash .github/scripts/prepare-publication-trees.sh
      - name: Freeze prior board for HTML browser checks
        env:
          MAIN_ROOT: ${{ steps.trees.outputs.main_root }}
        run: |
          previous="$RUNNER_TEMP/previous-main"
          mkdir -p "$previous/board"
          cp "$MAIN_ROOT/manifest.json" "$previous/manifest.json"
          board_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["board"])' "$previous/manifest.json")"
          cp "$MAIN_ROOT/board/$board_sha.json" "$previous/board/$board_sha.json"
      - name: Build canonical disclosure projection from qualified sources
        env:
          REVIEW_ROOT: ${{ steps.trees.outputs.review_root }}
          PYTHONPATH: backend/src
        run: |
          python -m unison_snapshot build-disclosure-candidate \
            --base ingest/current.json --harmonize-cutoffs \
            --source "house_clerk=$REVIEW_ROOT/candidates/sources/house_clerk-current.json" \
            --source "oge=$REVIEW_ROOT/candidates/sources/oge-current.json" \
            --source "senate_efd=$REVIEW_ROOT/candidates/sources/senate_efd-current.json" \
            --output "$RUNNER_TEMP/governed-disclosure.json" \
            --audit-output "$RUNNER_TEMP/governed-cutoff.json"
      - name: Receive independently prepared prices
        if: needs.refresh.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: prepared-prices-${{ github.run_id }}
          path: ${{ runner.temp }}/prepared-prices
      - name: Join current disclosures with fixed prices without vendor requests
        env:
          PYTHONPATH: backend/src
          REFRESHED: ${{ needs.refresh.result }}
          CACHE_MAIN_ROOT: ${{ steps.trees.outputs.cache_main_root }}
          CACHE_MARKET_ROOT: ${{ steps.trees.outputs.cache_market_root }}
          CACHE_MARKET_COMMIT: ${{ steps.trees.outputs.cache_market_commit }}
          MARKET_BASE: ${{ steps.trees.outputs.market_base }}
        run: |
          prepared_args=()
          if [ "$REFRESHED" = success ]; then
            prepared_args=(--prepared "$RUNNER_TEMP/prepared-prices")
            CACHE_MARKET_COMMIT="$MARKET_BASE"
            cp "$RUNNER_TEMP/prepared-prices/market-audit.json" "$RUNNER_TEMP/market-audit.json"
            cp "$RUNNER_TEMP/prepared-prices/twelve-audit.json" "$RUNNER_TEMP/twelve-audit.json"
          fi
          python -m unison_snapshot build-cached-candidate \
            --input "$RUNNER_TEMP/governed-disclosure.json" \
            --main-root "$CACHE_MAIN_ROOT" --market-root "$CACHE_MARKET_ROOT" \
            --market-commit "$CACHE_MARKET_COMMIT" \
            "${prepared_args[@]}" --output-dir "$RUNNER_TEMP"
      - name: Select fixed published readback probes
        id: probes
        run: |
          python - <<'PY'
          import json, os
          candidate = json.load(open(os.environ['RUNNER_TEMP'] + '/complete-candidate.json'))
          covered = {row['ticker'] for row in candidate['security_market_data']}
          twelve = sorted(row['ticker'] for row in candidate['security_market_data']
                          if row['source_id'] == 'twelve_data_split_adjusted_eod')
          if not twelve:
              raise SystemExit('Twelve Data probe is missing from the candidate')
          person_id = 'oge:076544f8ba0638cf'
          person_holdings = [row for row in candidate['reported_holdings']
                             if row['person_id'] == person_id]
          if not person_holdings:
              raise SystemExit('Trump person holding probe is missing')
          person_transactions = [row for row in candidate['transactions']
                                 if row['person_id'] == person_id]
          if not person_transactions:
              raise SystemExit('Trump person transaction probe is missing')
          ticker = 'MSFT'
          if ticker not in covered or not any(
                  row.get('ticker') == ticker for row in candidate['transactions']):
              raise SystemExit('MSFT transaction and market probe is missing')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"person_id={person_id}\n")
              output.write(f"person_holding_count={len(person_holdings)}\n")
              output.write(f"person_transaction_count={len(person_transactions)}\n")
              output.write(f"ticker={ticker}\n")
              output.write(f"twelve_ticker={twelve[0]}\n")
              output.write(f"people_count={len(candidate['people'])}\n")
              output.write(f"transaction_count={len(candidate['transactions'])}\n")
              output.write(f"holding_count={len(candidate['reported_holdings'])}\n")
              output.write(f"market_row_count={len(candidate['security_market_data'])}\n")
              output.write(f"source_health_count={len(candidate['source_health'])}\n")
          PY
      - name: Verify first-launch disclosure completeness
        env:
          REVIEW_ROOT: ${{ steps.trees.outputs.review_root }}
          PYTHONPATH: backend/src
        run: |
          python -m unison_snapshot verify-first-launch \
            --review-root "$REVIEW_ROOT" \
            --input "$RUNNER_TEMP/governed-disclosure.json" \
            --output "$RUNNER_TEMP/release-readiness.json"
      - name: Reconcile canonical publication changes
        env:
          REVIEW_ROOT: ${{ steps.trees.outputs.review_root }}
          MAIN_ROOT: ${{ steps.trees.outputs.main_root }}
          PYTHONPATH: backend/src
        run: |
          board_sha="$(python -c 'import json,os; print(json.load(open(os.environ["MAIN_ROOT"] + "/manifest.json", encoding="utf-8"))["board"])')"
          main_sha="$(git -C "$MAIN_ROOT" rev-parse HEAD)"
          review_sha="$(git -C "$REVIEW_ROOT" rev-parse HEAD)"
          transition_args=(--repo . --evidence-commit "${{ steps.trees.outputs.evidence_commit }}")
          if [ -f "$REVIEW_ROOT/status/publication_transitions.json" ]; then
            transition_args+=(--transitions "$REVIEW_ROOT/status/publication_transitions.json")
          fi
          python -m unison_snapshot.fact_policy.publication_delta \
            --previous-board "$MAIN_ROOT/board/$board_sha.json" \
            --unified "$RUNNER_TEMP/governed-disclosure.json" \
            --prepared "$RUNNER_TEMP/complete-candidate.json" \
            --source-root "$REVIEW_ROOT/candidates/sources" \
            --main-commit "$main_sha" --review-commit "$review_sha" \
            "${transition_args[@]}" \
            --output "$RUNNER_TEMP/publication-delta.json"
      - name: Keep publication difference report
        uses: actions/upload-artifact@v4
        with:
          name: publication-delta-${{ github.run_id }}
          path: ${{ runner.temp }}/publication-delta.json
          if-no-files-found: error
          retention-days: 30
      - name: Prepare and commit market branch
        id: market
        env:
          MARKET_ROOT: ${{ steps.trees.outputs.market_root }}
          REFRESHED: ${{ needs.refresh.result }}
          CACHE_MARKET_COMMIT: ${{ steps.trees.outputs.cache_market_commit }}
          PYTHONPATH: backend/src
        run: |
          if [ "$REFRESHED" != success ]; then
            echo "market_sha=$CACHE_MARKET_COMMIT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -m unison_snapshot prepare-market-publication \
            --input "$RUNNER_TEMP/complete-candidate.json" --root "$MARKET_ROOT" \
            --audit "$RUNNER_TEMP/market-audit.json" \
            --twelve-audit "$RUNNER_TEMP/twelve-audit.json" \
            --metadata-output "$RUNNER_TEMP/market-publication.json"
          git -C "$MARKET_ROOT" add -A -- market market-pages
          if ! git -C "$MARKET_ROOT" diff --cached --quiet; then
            git -C "$MARKET_ROOT" config user.name "github-actions[bot]"
            git -C "$MARKET_ROOT" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$MARKET_ROOT" commit -m "market: licensed Alpaca EOD ${{ github.run_id }}"
          fi
          market_sha="$(git -C "$MARKET_ROOT" rev-parse HEAD)"
          echo "market_sha=$market_sha" >> "$GITHUB_OUTPUT"
      - name: Prepare complete main snapshot
        id: main
        env:
          MAIN_ROOT: ${{ steps.trees.outputs.main_root }}
          MARKET_SHA: ${{ steps.market.outputs.market_sha }}
          PYTHONPATH: backend/src
        run: |
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python -m unison_snapshot build-disclosure-status \
            --evidence-root "${{ steps.trees.outputs.evidence_root }}" \
            --review-root "${{ steps.trees.outputs.review_root }}" \
            --input "$RUNNER_TEMP/complete-candidate.json" \
            --code-commit "$(git rev-parse HEAD)" \
            --previous-main-commit "${{ steps.trees.outputs.main_base }}" \
            --output "$RUNNER_TEMP/disclosure-status-input.json"
          python -m unison_snapshot prepare-publication \
            --input "$RUNNER_TEMP/complete-candidate.json" --root "$MAIN_ROOT" \
            --generated-at "$generated_at" --allow-market --market-commit "$MARKET_SHA" \
            --market-pages-file "$RUNNER_TEMP/market-publication.json" \
            --consumer-validation-file "$RUNNER_TEMP/consumer-validation.json" \
            --disclosure-status-input "$RUNNER_TEMP/disclosure-status-input.json"
          git -C "$MAIN_ROOT" add -A -- manifest.json board people tickers status
          if git -C "$MAIN_ROOT" diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git -C "$MAIN_ROOT" config user.name "github-actions[bot]"
            git -C "$MAIN_ROOT" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            snapshot_id="$(python -c "import json; print(json.load(open('$MAIN_ROOT/manifest.json'))['snapshot_id'])")"
            git -C "$MAIN_ROOT" commit -m "snapshot $snapshot_id"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          main_sha="$(git -C "$MAIN_ROOT" rev-parse HEAD)"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
      - name: Reject content already rejected by the published client
        env:
          MAIN_ROOT: ${{ steps.trees.outputs.main_root }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          PYTHONPATH=backend/src python -m unison_snapshot.publication_smoke \
            --manifest "$MAIN_ROOT/manifest.json" --repository "$REPOSITORY"
      - name: Publish immutable preflight commits without moving production
        id: preflight
        env:
          MAIN_ROOT: ${{ steps.trees.outputs.main_root }}
          MAIN_SHA: ${{ steps.main.outputs.main_sha }}
          MAIN_BASE: ${{ steps.trees.outputs.main_base }}
          MARKET_SHA: ${{ steps.market.outputs.market_sha }}
          MARKET_BASE: ${{ steps.trees.outputs.market_base }}
        run: |
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          remote_market="$(git ls-remote origin refs/heads/market | cut -f1)"
          test "$remote_main" = "$MAIN_BASE" || {
            echo "main moved after the candidate was built; refusing stale publication" >&2
            exit 1
          }
          test "$remote_market" = "$MARKET_BASE" || {
            echo "market moved after the candidate was built; refusing stale publication" >&2
            exit 1
          }
          main_ref="refs/heads/preflight/${{ github.run_id }}/main"
          market_ref="refs/heads/preflight/${{ github.run_id }}/market"
          git -C "$MAIN_ROOT" push --atomic origin \
            "$MAIN_SHA:$main_ref" "$MARKET_SHA:$market_ref"
          echo "main_ref=$main_ref" >> "$GITHUB_OUTPUT"
          echo "market_ref=$market_ref" >> "$GITHUB_OUTPUT"
      - name: Read back immutable prepared main and market commits
        if: ${{ !inputs.skip_prepared_readback }}
        env:
          EXPECTED_MAIN: ${{ steps.main.outputs.main_sha }}
          EXPECTED_MARKET: ${{ steps.market.outputs.market_sha }}
          PERSON_ID: ${{ steps.probes.outputs.person_id }}
          TICKER: ${{ steps.probes.outputs.ticker }}
          TWELVE_TICKER: ${{ steps.probes.outputs.twelve_ticker }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: backend/src
        run: |
          python -m unison_snapshot verify-prepared-publication \
            --owner hunterhigh --repo us-politician-trades-data \
            --main-commit "$EXPECTED_MAIN" --market-commit "$EXPECTED_MARKET" \
            --person-id "$PERSON_ID" --ticker "$TICKER" \
            --twelve-ticker "$TWELVE_TICKER" \
            --expected-people "${{ steps.probes.outputs.people_count }}" \
            --expected-transactions "${{ steps.probes.outputs.transaction_count }}" \
            --expected-holdings "${{ steps.probes.outputs.holding_count }}" \
            --expected-market-rows "${{ steps.probes.outputs.market_row_count }}" \
            --expected-source-health "${{ steps.probes.outputs.source_health_count }}" \
            --expected-person-holdings "${{ steps.probes.outputs.person_holding_count }}" \
            --expected-person-transactions "${{ steps.probes.outputs.person_transaction_count }}" \
            --require-disclosure-status \
            --expected-review-commit "${{ steps.trees.outputs.review_commit }}" \
            --expected-evidence-commit "${{ steps.trees.outputs.evidence_commit }}" \
            --published-main-root "${{ steps.trees.outputs.cache_main_root }}" \
            --published-market-root "${{ steps.trees.outputs.cache_market_root }}" \
            --published-market-commit "${{ steps.trees.outputs.cache_market_commit }}" \
            --output-dir "$RUNNER_TEMP/prepared-readback"
      - name: Verify publication in both browser frontends
        env:
          SKIP_PREPARED_READBACK: ${{ inputs.skip_prepared_readback }}
          REQUIRE_TRUMP_SEPT_OGE: ${{ inputs.require_trump_sept_oge }}
          PREVIOUS_MAIN_ROOT: ${{ runner.temp }}/previous-main
        run: |
          if [ "$SKIP_PREPARED_READBACK" = true ]; then
            export PRODUCTION_DASHBOARD_HTML="$RUNNER_TEMP/complete-dashboard.html"
          else
            export PRODUCTION_DASHBOARD_HTML="$RUNNER_TEMP/prepared-readback/dashboard.html"
          fi
          echo "Browser input: $PRODUCTION_DASHBOARD_HTML"
          npm ci
          npm run test:production
          npm run test:latest-html
        working-directory: frontend-e2e
      - name: Record publication coverage and price age
        env:
          MARKET_SHA: ${{ steps.market.outputs.market_sha }}
          MAIN_SHA: ${{ steps.main.outputs.main_sha }}
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          audit = json.loads((root / 'publication-market-audit.json').read_text())
          readiness = json.loads((root / 'release-readiness.json').read_text())
          print(f"Main: `{os.environ['MAIN_SHA']}`; market: `{os.environ['MARKET_SHA']}`")
          print(f"Price mode: {audit['mode']}; publication vendor requests: 0")
          print(f"Disclosures: {readiness['people_count']} people, {readiness['transaction_count']} transactions, {readiness['reported_holding_count']} holdings")
          print(f"Prices: {audit['market_row_count']} tickers, {audit['price_point_count']} points; pending {len(audit['pending_tickers'])}")
          for row in audit['market_source_health']:
              print(f"- {row['source_id']}: last successful sync {row.get('last_successful_sync_at')}; cutoff {row.get('data_cutoff_at')}")
          print('Pending price tickers:', ', '.join(audit['pending_tickers']) or 'none')
          path = root / 'twelve-audit.json'
          if path.exists():
              twelve = json.loads(path.read_text())
              print(f"Twelve Data: new {twelve['new_accepted_count']}, cached {twelve['cached_accepted_count']}, deferred {twelve['backlog_count']}, deduplicated {twelve['deduplicated_row_count']}")
              print('Refresh transport:', json.dumps(twelve['transport'], sort_keys=True))
          PY
      - name: Exercise late failure before publication
        if: inputs.recovery_stop_before_publish
        env:
          MAIN_BASE: ${{ steps.trees.outputs.main_base }}
          MARKET_BASE: ${{ steps.trees.outputs.market_base }}
          MAIN_SHA: ${{ steps.main.outputs.main_sha }}
          MARKET_SHA: ${{ steps.market.outputs.market_sha }}
          PREFLIGHT_MAIN_REF: ${{ steps.preflight.outputs.main_ref }}
          PREFLIGHT_MARKET_REF: ${{ steps.preflight.outputs.market_ref }}
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_BASE"
          test "$(git ls-remote origin refs/heads/market | cut -f1)" = "$MARKET_BASE"
          test "$(git ls-remote origin "$PREFLIGHT_MAIN_REF" | cut -f1)" = "$MAIN_SHA"
          test "$(git ls-remote origin "$PREFLIGHT_MARKET_REF" | cut -f1)" = "$MARKET_SHA"
          git push --atomic origin ":$PREFLIGHT_MAIN_REF" ":$PREFLIGHT_MARKET_REF"
          printf 'Controlled stop after verified preflight; main `%s` and market `%s` unchanged.\n' \
            "$MAIN_BASE" "$MARKET_BASE" >> "$GITHUB_STEP_SUMMARY"
          exit 86
      - name: Atomically publish the verified main, market, and tags
        env:
          REFRESHED: ${{ needs.refresh.result }}
          MAIN_ROOT: ${{ steps.trees.outputs.main_root }}
          MAIN_SHA: ${{ steps.main.outputs.main_sha }}
          MAIN_BASE: ${{ steps.trees.outputs.main_base }}
          MARKET_SHA: ${{ steps.market.outputs.market_sha }}
          MARKET_BASE: ${{ steps.trees.outputs.market_base }}
          PREFLIGHT_MAIN_REF: ${{ steps.preflight.outputs.main_ref }}
          PREFLIGHT_MARKET_REF: ${{ steps.preflight.outputs.market_ref }}
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_BASE"
          test "$(git ls-remote origin refs/heads/market | cut -f1)" = "$MARKET_BASE"
          test "$(git ls-remote origin "$PREFLIGHT_MAIN_REF" | cut -f1)" = "$MAIN_SHA"
          test "$(git ls-remote origin "$PREFLIGHT_MARKET_REF" | cut -f1)" = "$MARKET_SHA"
          git -C "$MAIN_ROOT" tag "published/$MAIN_SHA" "$MAIN_SHA"
          git -C "$MAIN_ROOT" tag "published-market/$MARKET_SHA" "$MARKET_SHA"
          market_ref=()
          if [ "$REFRESHED" = success ]; then
            market_ref=("$MARKET_SHA:refs/heads/market")
          fi
          git -C "$MAIN_ROOT" push --atomic origin \
            "$MAIN_SHA:refs/heads/main" "${market_ref[@]}" \
            "refs/tags/published/$MAIN_SHA" \
            "refs/tags/published-market/$MARKET_SHA" \
            ":$PREFLIGHT_MAIN_REF" ":$PREFLIGHT_MARKET_REF"
