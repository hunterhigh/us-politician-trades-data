name: Production health and alerts
on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Publish complete production snapshot']
    types: [completed]
    branches: [code]
env:
  SENATE_MAX_STALE_DAYS: ${{ vars.SENATE_MAX_STALE_DAYS || '30' }}

permissions:
  packages: read
  contents: write
  issues: write
  actions: write
concurrency:
  # Health has its own branch and never consumes a source writer pending slot.
  group: production-health
  cancel-in-progress: false
jobs:
  observe:
    if: github.ref == 'refs/heads/code'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: ghcr.io/hunterhigh/us-politician-trades-data-runtime@sha256:c15f99ffa11f27a814aee26328977ab5691954b469baa4932d56706aef1cd9e4
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: code
          fetch-depth: 1
      - name: Activate fixed source runtime
        uses: ./.github/actions/setup-source
      - name: Read current data and independent source state
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main +refs/heads/state:refs/remotes/origin/state
          git worktree add --detach "$RUNNER_TEMP/health-main" origin/main
          git worktree add --detach "$RUNNER_TEMP/health-state" origin/state
      - name: Prepare the independent health branch
        run: |
          mkdir -p .local
          if git ls-remote --exit-code origin refs/heads/health > .local/health-ref; then
            git fetch --no-tags origin +refs/heads/health:refs/remotes/origin/health
            git worktree add --detach "$RUNNER_TEMP/health-output" origin/health
          else
            result=$?
            test "$result" = 2
            git worktree add --detach --no-checkout "$RUNNER_TEMP/health-output" HEAD
            git -C "$RUNNER_TEMP/health-output" switch --orphan health-output
          fi
      - name: Evaluate health and reconcile one Issue per condition
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          PYTHONPATH=backend/src python -m unison_snapshot.production_health \
            --main-root "$RUNNER_TEMP/health-main" \
            --state-root "$RUNNER_TEMP/health-state" --health-root "$RUNNER_TEMP/health-output" \
            --repository "$REPOSITORY" \
            --observe-publication-runs --observe-assembly --observe-source-quality --apply-alerts \
            --smoke-client-root "$GITHUB_WORKSPACE" --apply-content-rollback
      - name: Publish independent health state without moving the formal snapshot
        run: |
          state_root="$RUNNER_TEMP/health-output"
          git -C "$state_root" add status/production_health.json status/publication_smoke.json status/quality_history.json
          if ! git -C "$state_root" diff --cached --quiet; then
            git -C "$state_root" config user.name "github-actions[bot]"
            git -C "$state_root" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$state_root" commit -m "health: update independent production status"
            git -C "$state_root" push origin HEAD:refs/heads/health
          fi
          echo "Live health: https://github.com/${{ github.repository }}/blob/health/status/production_health.json" >> "$GITHUB_STEP_SUMMARY"
