[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "unison-snapshot"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
house-ingest = ["pdfplumber==0.11.9", "numpy==2.4.4"]
oge-raster-ocr = ["pdfplumber==0.11.9", "numpy==2.4.4", "rapidocr-onnxruntime==1.4.4", "PyMuPDF==1.28.2"]

[tool.setuptools.packages.find]
where = ["src"]
